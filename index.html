<div class="app"><aside><div class="brand"><div class="brandmark">✳</div><div>glowquest<small>THE BECOMING PROJECT</small></div></div><div><div class="sideintro">Your little universe</div><nav id="nav"></nav></div><div class="sidecard"><div class="script">little by little,<br>a whole lot of you.</div><p class="tiny">Build a life you love showing up for.</p><div id="sideProgress"></div></div><div class="profile"><div class="avatar">RZ</div><div><b id="sideName">Rinkal</b><div class="tiny">In my becoming era ✦</div></div></div></aside><main><div class="topbar"><div class="eyebrow">A promise to yourself · Est. 2026</div><div class="right"><span class="pill"><span class="dot"></span><span id="saveStatus" role="status">Local autosave</span></span><button class="small" onclick="exportData()">↗ Backup</button></div></div><div id="content"></div></main></div><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><input id="importFile" type="file" accept="application/json,.json" hidden>
<script>
const DATA = {"problems":[{"id":1,"title":"Majority Element-I","group":"Arrays","pattern":"Linear Scan","difficulty":"Core","concept":"Cancellation pairs: two different values cancel; a majority survives. Track candidate and balance, then discuss when verification is required.","drill":"Trace [2,2,1,1,1,2,2], writing candidate and balance after each step."},{"id":2,"title":"Kadane's Algorithm","group":"Arrays","pattern":"Linear Scan","difficulty":"Core","concept":"Define the best sum ending at index i. Either extend yesterday’s segment or restart at the current value; keep a separate global best.","drill":"Trace [-2,1,-3,4,-1,2,1,-5,4]. Check an all-negative array too."},{"id":3,"title":"Majority Element-II","group":"Arrays","pattern":"Linear Scan","difficulty":"Core","concept":"More than n/3 occurrences allows at most two answers. Maintain two candidates, cancel triples of distinct values, then recount candidates.","drill":"Trace [1,2,1,2,3,1,2]; explain why a second counting pass is needed."},{"id":4,"title":"Maximum Product Subarray in an Array","group":"Arrays","pattern":"Linear Scan","difficulty":"Core","concept":"A negative multiplier can turn the smallest ending product into the largest. Track both extremes using the previous step’s values.","drill":"Trace [2,3,-2,4] and [-2,0,-1]; explain how zero resets a segment."},{"id":5,"title":"Sort an array of 0's 1's and 2's","group":"Arrays","pattern":"Two Pointers","difficulty":"Core","concept":"Dutch National Flag: low marks the next zero, mid the unknown region, and high the next two. Preserve the four regions after every swap.","drill":"Trace [2,0,2,1,1,0]; explain why mid does not advance after swapping with high."},{"id":6,"title":"3 Sum","group":"Arrays","pattern":"Two Pointers","difficulty":"Core","concept":"Sorting lets two pointers move monotonically for a fixed first number. Skip repeated values without skipping distinct valid triples.","drill":"Trace [-1,0,1,2,-1,-4], including duplicate skips and the pointer movement rule."},{"id":7,"title":"Next Permutation","group":"Arrays","pattern":"Two Pointers","difficulty":"Core","concept":"Lexicographic order: find the rightmost increasing pivot, swap with its smallest larger suffix value, then reverse the descending suffix.","drill":"Trace [1,3,2] and [3,2,1]; explain why the suffix reversal gives the smallest next result."},{"id":8,"title":"4 Sum","group":"Arrays","pattern":"Two Pointers","difficulty":"Pro","concept":"Fix two sorted positions and use two pointers for the remaining sum. Guard against duplicate quadruplets and integer overflow.","drill":"Trace [1,0,-1,0,-2,2] with target 0. Use long for sums in Java."},{"id":9,"title":"Merge two sorted arrays without extra space","group":"Arrays","pattern":"Two Pointers","difficulty":"Core","concept":"Exploit sorted order and avoid overwriting unread values. Read the supplied problem’s storage contract before choosing backward merge or a gap strategy.","drill":"Trace [1,3,5,0,0,0] with m=3 and [2,4,6] with n=3; also explain how the strategy changes for two fixed-size arrays."},{"id":10,"title":"Trapping Rainwater","group":"Arrays","pattern":"Two Pointers","difficulty":"Pro","concept":"Water at a position is bounded by the smaller of the left and right maxima. A two-pointer decision is safe when one boundary is already smaller.","drill":"Trace [0,1,0,2,1,0,1,3]; record leftMax, rightMax and water added."},{"id":11,"title":"Count Inversions","group":"Arrays","pattern":"Divide and Conquer","difficulty":"Pro","concept":"Merge sort separates within-half inversions from cross-half inversions. When right[j] is smaller, every remaining left value contributes.","drill":"Merge [2,4,6] with [1,3,5]; count contributions and explain why sorting enables bulk counting."},{"id":12,"title":"Reverse Pairs","group":"Arrays","pattern":"Divide and Conquer","difficulty":"Pro","concept":"Count i<j with a[i]>2*a[j] using sorted halves and a separate monotonic counting pointer before the ordinary merge.","drill":"Trace [1,3,2,3,1]; use 2L * value in Java and distinguish reverse pairs from inversions."},{"id":13,"title":"Two Sum","group":"Hashing","pattern":"Hashing & Prefix Sums","difficulty":"Basic","concept":"A hash map stores values already seen. For each x, look for target-x before insertion so one index is not reused.","drill":"Trace [2,7,11,15] with target 9 and [3,3] with target 6."},{"id":14,"title":"Longest Consecutive Sequence in an Array","group":"Hashing","pattern":"Hashing & Prefix Sums","difficulty":"Core","concept":"Use a set for membership and only grow a sequence when x-1 is absent. This prevents repeatedly scanning the same chain.","drill":"Trace [100,4,200,1,3,2]; justify expected linear work despite the nested-looking loop."},{"id":15,"title":"Longest subarray with sum K","group":"Hashing","pattern":"Hashing & Prefix Sums","difficulty":"Core","concept":"prefix[j]-prefix[i]=K. Keep the earliest index of each prefix sum to maximize length; unlike a simple window, this supports negative values.","drill":"Trace [1,-1,5,-2,3] with K=3; explain why overwriting an earlier prefix index hurts."},{"id":16,"title":"Count subarrays with given sum","group":"Hashing","pattern":"Hashing & Prefix Sums","difficulty":"Core","concept":"Count previous prefixes equal to currentPrefix-K. Store frequencies rather than just one index, and seed the empty prefix with frequency one.","drill":"Trace [1,1,1] with K=2, showing every frequency update."},{"id":17,"title":"Count subarrays with given xor K","group":"Hashing","pattern":"Hashing & Prefix Sums","difficulty":"Pro","concept":"XOR cancels itself: if prefixA XOR prefixB=K, the needed earlier prefix is currentXor XOR K. Count matching prefix frequencies.","drill":"Trace [4,2,2,6,4] with K=6; explain the initial frequency for XOR zero."},{"id":18,"title":"Find peak element","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"A slope comparison with mid+1 identifies a side that must contain a peak. Maintain valid bounds without reading outside the array.","drill":"Trace [1,2,3,1] and [3,2,1]; state what counts as a peak at an endpoint."},{"id":19,"title":"Find minimum in Rotated Sorted Array","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"Compare the middle with the right endpoint to identify which side contains the rotation minimum; preserve the minimum in the search range.","drill":"Trace [4,5,6,7,0,1,2]; test an unrotated array."},{"id":20,"title":"Search in rotated sorted array-II","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"One half can often be identified as sorted, but equal boundary values create ambiguity. Shrink equal boundaries when no ordered-half decision is possible.","drill":"Trace [2,5,6,0,0,1,2] for 0; explain why duplicates can cause linear worst-case time."},{"id":21,"title":"Single element in sorted array","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"Before the single element, pairs start at even indices; afterward the alignment flips. Use parity to keep the single inside the interval.","drill":"Trace [1,1,2,3,3,4,4]; compare mid with its paired neighbour safely."},{"id":22,"title":"Search in 2D matrix - II","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"Rows and columns are sorted, but the whole matrix need not be flattened-sorted. From a top-right corner, each comparison removes a row or column.","drill":"Trace [[1,4,7],[2,5,8],[3,6,9]] looking for 6; explain the elimination rule."},{"id":23,"title":"Find Peak Element - II","group":"Binary Search","pattern":"Binary Search","difficulty":"Core","concept":"Choose a middle column and its maximum row entry; compare horizontal neighbours to decide which column range can contain a peak.","drill":"Trace [[10,20,15],[21,30,14],[7,16,32]]; distinguish a 2D peak from a global maximum."},{"id":24,"title":"Find Nth root of a number","group":"Binary Search","pattern":"Search on Answer","difficulty":"Core","concept":"Search candidate integer roots. Compare powers against the target with an early stop to avoid overflow; return failure when no integer root exists.","drill":"Try n=3, m=27 and n=3, m=20; define the feasible comparison precisely."},{"id":25,"title":"Koko eating bananas","group":"Binary Search","pattern":"Search on Answer","difficulty":"Pro","concept":"Eating speed is the answer space. Total hours is the sum of ceiling divisions and decreases monotonically as speed increases.","drill":"Trace [3,6,7,11] with h=8; implement ceiling division without floating point."},{"id":26,"title":"Aggressive Cows","group":"Binary Search","pattern":"Search on Answer","difficulty":"Pro","concept":"The candidate minimum distance is feasible if greedy placement fits all cows. Feasibility changes monotonically as distance increases.","drill":"Place 3 cows in [1,2,4,8,9]; compare distance 3 and distance 4."},{"id":27,"title":"Book Allocation Problem","group":"Binary Search","pattern":"Search on Answer","difficulty":"Pro","concept":"Search the maximum allowed load. Greedily form contiguous groups and count students; start bounds at the largest book and total pages.","drill":"Trace [12,34,67,90] for 2 students; explain why pages cannot be split arbitrarily."},{"id":28,"title":"Matrix Median","group":"Binary Search","pattern":"Search on Answer","difficulty":"Pro","concept":"For a row-wise sorted matrix, count values <= a candidate using an upper-bound search in each row; binary-search the value range.","drill":"Use [[1,3,5],[2,6,9],[3,6,9]]; compare counts at candidate 4 and 5."},{"id":29,"title":"Kth element of 2 sorted arrays","group":"Binary Search","pattern":"Partition Search","difficulty":"Pro","concept":"Partition the smaller array and derive the complementary partition so the left side has k elements. Check cross-boundary ordering.","drill":"Use [2,3,6,7,9], [1,4,8,10], k=5; write valid partition bounds."},{"id":30,"title":"Median of 2 sorted arrays","group":"Binary Search","pattern":"Partition Search","difficulty":"Pro","concept":"Partition both arrays into balanced halves with every left value <= every right value. Handle odd/even totals and empty boundaries.","drill":"Trace [1,3] and [2], then [1,2] and [3,4]; explain sentinel boundaries."},{"id":31,"title":"Longest Substring Without Repeating Characters","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Core","concept":"Maintain a window with unique characters. Move the left edge forward after a repeated character without ever moving it backward.","drill":"Trace 'abba'; explain why the earlier occurrence may lie outside the current window."},{"id":32,"title":"Maximum Points You Can Obtain from Cards","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Core","concept":"Taking k cards from the ends is equivalent to dropping one contiguous middle segment of length n-k. Compare prefix/suffix splits or minimize that middle sum.","drill":"Trace [1,2,3,4,5,6,1], k=3; enumerate the four possible end splits."},{"id":33,"title":"Max Consecutive Ones III","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Core","concept":"Maintain a window containing at most k zeros. Shrink when the zero budget is exceeded; the window length measures the possible ones after flips.","drill":"Trace [1,1,0,0,1,1,1,0], k=2; track zero count and left boundary."},{"id":34,"title":"Longest Repeating Character Replacement","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Pro","concept":"A window can become one repeated character when windowLength-maxFrequency <= k. Understand the difference between exact and stale maximum frequency variants.","drill":"Trace 'AABABBA', k=1; explain the replacement budget invariant."},{"id":35,"title":"Longest Substring With At Most K Distinct Characters","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Pro","concept":"Store character counts, not only presence. Shrink until distinct keys <= k, deleting a key when its count reaches zero.","drill":"Trace 'eceba', k=2; identify when a character truly leaves the window."},{"id":36,"title":"Minimum Window Substring","group":"Sliding Window and Two Pointers","pattern":"Sliding Window","difficulty":"Pro","concept":"Track required multiplicities and formed requirements. Expand to cover the target, then shrink while preserving coverage to minimize length.","drill":"Trace 'ADOBECODEBANC' with target 'ABC'; also consider a target with repeated letters."},{"id":37,"title":"Number of Substrings Containing All Three Characters","group":"Sliding Window and Two Pointers","pattern":"Counting Windows","difficulty":"Core","concept":"Use last-seen positions of a,b,c: when all exist, the smallest position determines how many valid starting points end here.","drill":"Trace 'abcabc'; show the number of new valid substrings at each right endpoint."},{"id":38,"title":"Binary Subarrays With Sum","group":"Sliding Window and Two Pointers","pattern":"Counting Windows","difficulty":"Core","concept":"For binary nonnegative arrays, exactCount(goal)=atMost(goal)-atMost(goal-1). Include the negative-budget base case.","drill":"Trace [1,0,1,0,1], goal=2; explain why this at-most window is not valid for arbitrary negatives."},{"id":39,"title":"Count number of Nice subarrays","group":"Sliding Window and Two Pointers","pattern":"Counting Windows","difficulty":"Pro","concept":"Treat odd values as 1 and even values as 0. Count subarrays with exactly k odds using prefix frequencies or two at-most counts.","drill":"Trace [1,1,2,1,1], k=3; explain how even elements create multiple valid boundaries."},{"id":40,"title":"Power Set","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Core","concept":"At each index choose to take or skip the item. Define recursive state and base case, and copy the path when saving a result.","drill":"Draw the decision tree for [1,2,3]; account for output-copying cost."},{"id":41,"title":"Generate Parentheses","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Core","concept":"Track opened and closed bracket counts. Add '(' while open<n and ')' only while close<open to keep every prefix valid.","drill":"Draw valid branches for n=3; identify branches pruned before completion."},{"id":42,"title":"Letter Combinations of a Phone Number","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Pro","concept":"Each digit selects a set of letters. Recurse by digit position and restore the path after each choice.","drill":"Generate choices for '23'; handle an empty input explicitly."},{"id":43,"title":"Combination Sum","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Core","concept":"To allow reuse, a take branch can stay on the same index; a skip branch advances. Remaining target and index define the state.","drill":"Trace candidates [2,3,6,7], target 7; explain why reordering a combination is not a new answer."},{"id":44,"title":"Combination Sum II","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Core","concept":"Sort first, use each index at most once, and skip equal values only at the same recursion depth.","drill":"Trace [10,1,2,7,6,1,5], target 8; explain why both 1s may still appear in a valid combination."},{"id":45,"title":"Subsets II","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Core","concept":"Duplicates in input require depth-local skipping after sorting. Save each path and avoid generating equal subsets via equivalent choices.","drill":"Trace [1,2,2]; distinguish skipping a duplicate sibling from forbidding repeated values entirely."},{"id":46,"title":"Palindrome partitioning","group":"Recursion and Backtracking","pattern":"Subsets & Combinations","difficulty":"Pro","concept":"Choose a next cut only when the substring is a palindrome. Backtrack over cuts; distinguish partition generation from minimum-cut optimization.","drill":"Trace 'aab'; test palindrome checking with two pointers."},{"id":47,"title":"Word Search","group":"Recursion and Backtracking","pattern":"Backtracking","difficulty":"Pro","concept":"State includes cell and word index. Mark a cell during the current path, explore valid neighbours, then restore it on backtracking.","drill":"Use [[A,B],[C,D]] for 'ABD'; explain why one cell cannot be reused within the same path."},{"id":48,"title":"N Queen","group":"Recursion and Backtracking","pattern":"Backtracking","difficulty":"Pro","concept":"Place one queen per row and maintain occupied columns and diagonals. Undo all state when leaving a branch.","drill":"For n=4, trace a failed placement and undo it; derive row-col and row+col diagonal identifiers."},{"id":49,"title":"Sudoku Solver","group":"Recursion and Backtracking","pattern":"Backtracking","difficulty":"Pro","concept":"Choose an empty cell, try allowed digits, recurse and restore on failure. Row, column and 3x3-box constraints must all hold.","drill":"For an empty cell at (4,7), compute its box index and list how you would test a candidate digit."},{"id":50,"title":"Find Middle of Linked List","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Basic","concept":"Move slow by one and fast by two. The stopping condition determines whether an even-length list returns the first or second middle.","drill":"Draw lengths 1, 2, 5 and 6; track both pointers without dereferencing null."},{"id":51,"title":"Find the intersection point of Y LL","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"Intersection means shared node identity, not equal values. Switching heads equalizes path lengths so pointers meet or both become null.","drill":"Draw lists with private lengths 2 and 4 followed by a common tail of length 3."},{"id":52,"title":"Check if LL is palindrome or not","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"Find the middle, reverse one half and compare values. Decide whether to restore the list afterward to preserve caller-visible structure.","drill":"Trace 1→2→2→1 and an odd-length palindrome; keep split boundaries correct."},{"id":53,"title":"Detect a loop in LL","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"If a cycle exists, a fast pointer gains on a slow pointer inside it. Guard fast and fast.next before advancing.","drill":"Draw a list whose tail links to the second node; track when the two pointers meet."},{"id":54,"title":"Remove Nth node from the back of the LL","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"Use a dummy head and a fixed gap between two pointers so the slow pointer stops just before the removed node.","drill":"Trace 1→2→3→4→5 with n=2, then n=5; explain why a dummy simplifies head deletion."},{"id":55,"title":"Find the starting point in LL","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"After Floyd’s pointers meet, reset one to the head and advance both by one. Distances modulo cycle length explain the entry point.","drill":"Draw prefix length 2 and cycle length 3; distinguish the meeting node from the entry node."},{"id":56,"title":"Length of loop in LL","group":"Linked List","pattern":"Fast & Slow Pointers","difficulty":"Core","concept":"First detect a meeting inside the cycle. Hold one pointer at the meeting node and count a full circuit with another.","drill":"Draw a cycle with four nodes and a non-cyclic prefix; count only cycle edges."},{"id":57,"title":"Reverse a LL","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Keep previous, current and next references. Save the next node before rewiring current.next so the remaining list is not lost.","drill":"Reverse 1→2→3 by hand, showing all three references at each step."},{"id":58,"title":"Merge two Sorted Lists","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Use a dummy head and attach the smaller current node. Advance the chosen input and attach the remaining tail when one finishes.","drill":"Merge 1→3→5 and 2→4; explain whether the operation reuses nodes or allocates new ones."},{"id":59,"title":"Sort a Linked List of 0's 1's and 2's","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Separate nodes into three stable chains with dummy heads, then concatenate and terminate the final tail safely.","drill":"Trace 2→0→1→2→0; test a list missing the entire middle-value chain."},{"id":60,"title":"Add two numbers in Linked List","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Traverse both lists with carry. Continue while either input or carry remains; check the problem’s digit-order contract.","drill":"For reverse-order digits, add 2→4→3 and 5→6→4; include a final carry example."},{"id":61,"title":"Rotate a LL","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Find length, reduce k modulo length, connect tail to head and break the ring at the new tail.","drill":"Rotate 1→2→3→4→5 right by k=7; locate the new tail before breaking the cycle."},{"id":62,"title":"Sort LL","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Core","concept":"Merge sort suits linked lists: split by fast/slow pointers, terminate the halves, recursively sort, then merge.","drill":"Split 4→2→1→3; explain why omitting the split termination can break recursion."},{"id":63,"title":"Clone a LL with random and next pointer","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Pro","concept":"A clone must preserve structure without pointing back into original nodes. Compare an old-to-new map with weaving clones between originals.","drill":"Draw three nodes with random links to self, another node and null; verify original and clone are independent."},{"id":64,"title":"Reverse LL in group of given size K","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Pro","concept":"Locate a complete group before reversing it, reconnect its head/tail, and preserve any incomplete suffix according to the specification.","drill":"Trace 1→2→3→4→5 with k=2; identify the pointers needed at each group boundary."},{"id":65,"title":"Flattening of LL","group":"Linked List","pattern":"Reversal & Rewiring","difficulty":"Pro","concept":"Treat sorted vertical chains as sorted lists to merge. Preserve the required output pointer and clear stale horizontal links where appropriate.","drill":"Merge bottom chains [1,4,7] and [2,3,8]; draw next versus bottom before coding."},{"id":66,"title":"Next Greater Element","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"Maintain candidates in a monotonic stack. Values popped by a larger element have found their next greater answer.","drill":"Trace [4,5,2,10,8]; explain why a popped candidate never becomes useful again."},{"id":67,"title":"Next Greater Element - 2","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"For a circular array, simulate two passes with index modulo n. Populate answers once while allowing the extra pass to resolve wraparound.","drill":"Trace [1,2,1]; account for at most a constant number of pushes/pops per index."},{"id":68,"title":"Stock span problem","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"Maintain decreasing prices with indices or aggregated spans. Pop prices <= today’s price to extend its consecutive span.","drill":"Trace [100,80,60,70,60,75,85]; compare storing indices versus storing span pairs."},{"id":69,"title":"Sum of Subarray Minimums","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"Use contribution counting: each value is minimum in a number of left/right extensions. Assign equal-value boundaries asymmetrically to avoid duplicate ownership.","drill":"Trace [3,1,2,4] and [2,2]; define previous-smaller and next-smaller-or-equal boundaries."},{"id":70,"title":"Sum of Subarray Ranges","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"Sum each value’s maximum contribution minus its minimum contribution. Use complementary monotonic boundary rules and a wide numeric type.","drill":"Trace [1,2,3]; compare contribution totals with a brute-force enumeration."},{"id":71,"title":"Remove K Digits","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Core","concept":"A monotonic increasing digit stack removes a larger previous digit when a smaller current digit can improve the prefix. Spend remaining removals from the end.","drill":"Trace '1432219', k=3; handle leading zeros and removing all digits."},{"id":72,"title":"Sliding Window Maximum","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Pro","concept":"Store indices in a decreasing deque. Remove expired indices at the front and dominated values at the back.","drill":"Trace [1,3,-1,-3,5,3,6,7], k=3; explain why values alone cannot identify expiration."},{"id":73,"title":"Largest rectangle in a histogram","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Pro","concept":"A popped bar’s height has a known right smaller boundary. The stack identifies its previous smaller boundary and hence the maximal rectangle width.","drill":"Trace [2,1,5,6,2,3]; test equal bars and the final stack flush."},{"id":74,"title":"Maximum Rectangles","group":"Stack and Queues","pattern":"Monotonic Stack / Queue","difficulty":"Pro","concept":"Convert each binary-matrix row to histogram heights by accumulating consecutive ones. Apply the histogram rectangle method at each row.","drill":"Build heights row by row for [[1,0,1],[1,1,1],[1,1,1]]."},{"id":75,"title":"Implement Min Stack","group":"Stack and Queues","pattern":"Data Structure Design","difficulty":"Core","concept":"Each push must preserve enough information to recover the minimum after a pop. Compare paired values/minima with a second minimum stack.","drill":"Push 3,1,2,1, then pop twice; track repeated minima correctly."},{"id":76,"title":"Asteroid Collision","group":"Stack and Queues","pattern":"Data Structure Design","difficulty":"Core","concept":"Only a right-moving previous asteroid and left-moving new asteroid can collide. Resolve repeated collisions before deciding whether to push.","drill":"Trace [10,2,-5] and [8,-8]; separate sign (direction) from magnitude (size)."},{"id":77,"title":"Celebrity Problem","group":"Stack and Queues","pattern":"Data Structure Design","difficulty":"Core","concept":"Pairwise elimination leaves one possible celebrity. A second pass must verify everyone knows the candidate and the candidate knows nobody else.","drill":"Use a 3×3 knows matrix with person 1 as celebrity, then change one relation to invalidate it."},{"id":78,"title":"LRU Cache","group":"Stack and Queues","pattern":"Data Structure Design","difficulty":"Pro","concept":"Combine key lookup in a hash map with recency order in a doubly linked list. Both reads and updates move a node to most recent.","drill":"For capacity 2, trace put(1), put(2), get(1), put(3); identify the evicted key and pointer changes."},{"id":79,"title":"LFU Cache","group":"Stack and Queues","pattern":"Data Structure Design","difficulty":"Pro","concept":"Track each key’s frequency plus recency within a frequency bucket. Maintain minFrequency and use LRU order for frequency ties.","drill":"For capacity 2, trace puts, repeated gets and a new insertion; explain when minFrequency changes."},{"id":80,"title":"Jump Game - I","group":"Greedy Algorithms","pattern":"Greedy","difficulty":"Core","concept":"Maintain the farthest reachable index while scanning only reachable positions. If the current index exceeds reach, the gap is impossible to cross.","drill":"Trace [2,3,1,1,4] and [3,2,1,0,4]; explain the invariant behind farthest reach."},{"id":81,"title":"Valid Paranthesis Checker","group":"Greedy Algorithms","pattern":"Greedy","difficulty":"Pro","concept":"For parentheses with wildcard '*', track a range of possible unmatched opens. Clamp the lower bound to zero and reject when the upper bound goes negative.","drill":"Trace '(*))'; explain why one greedy interpretation of '*' is insufficient."},{"id":82,"title":"Candy","group":"Greedy Algorithms","pattern":"Greedy","difficulty":"Pro","concept":"Neighbour inequalities impose lower bounds from both sides. A left-to-right pass and right-to-left pass can be combined with max.","drill":"Trace ratings [1,0,2] and [1,2,2]; explain why equal ratings do not require increasing candies."},{"id":83,"title":"N meetings in one room","group":"Greedy Algorithms","pattern":"Intervals & Scheduling","difficulty":"Core","concept":"Choose the earliest finishing compatible meeting so the remaining time is as large as possible. Check whether touching endpoints are allowed.","drill":"Trace intervals (1,2),(3,4),(0,6),(5,7),(8,9); explain an exchange argument."},{"id":84,"title":"Insert Interval","group":"Greedy Algorithms","pattern":"Intervals & Scheduling","difficulty":"Core","concept":"A sorted disjoint interval list has three regions: before the new interval, overlapping it, and after it. Merge only the middle region.","drill":"Insert [2,5] into [[1,3],[6,9]]; test insertion before all existing intervals."},{"id":85,"title":"Non-overlapping Intervals","group":"Greedy Algorithms","pattern":"Intervals & Scheduling","difficulty":"Core","concept":"Keep a maximum-size compatible subset using earliest finishes; removals equal total minus kept. Treat endpoint equality according to the problem.","drill":"Trace [[1,2],[2,3],[3,4],[1,3]] and explain which interval you discard."},{"id":86,"title":"Minimum number of platforms required for a railway","group":"Greedy Algorithms","pattern":"Intervals & Scheduling","difficulty":"Core","concept":"Sweep sorted arrival/departure events and measure peak simultaneous occupancy. Resolve equal-time arrivals/departures using the specified convention.","drill":"Trace arrivals [900,940,950] and departures [910,1200,1120]."},{"id":87,"title":"Job sequencing Problem","group":"Greedy Algorithms","pattern":"Intervals & Scheduling","difficulty":"Core","concept":"Sort jobs by profit and place each in the latest free slot before its deadline. Late placement preserves earlier slots for tighter deadlines.","drill":"Trace jobs (deadline,profit) [(2,100),(1,19),(2,27),(1,25),(3,15)]."},{"id":88,"title":"Heapify Algorithm","group":"Heaps","pattern":"Heap / Priority Queue","difficulty":"Core","concept":"For an array heap, compute child indices and sift a misplaced value down into already-valid child heaps. A heap is partially ordered, not fully sorted.","drill":"Sift down the root in [9,2,3,4,5] as a min heap; explain why only one path changes."},{"id":89,"title":"Build heap from a given Array","group":"Heaps","pattern":"Heap / Priority Queue","difficulty":"Core","concept":"Apply heapify from the last internal node back to the root. The sum of node heights gives linear build time, unlike repeated insertion’s bound.","drill":"Turn [4,10,3,5,1] into a max heap; identify leaves and the last internal index."},{"id":90,"title":"Implement Min Heap","group":"Heaps","pattern":"Heap / Priority Queue","difficulty":"Core","concept":"Insertion appends then sifts up; extracting the minimum moves the last value to the root then sifts down. Preserve the heap invariant after each operation.","drill":"Insert 5,2,7,1 and extract twice; show the backing array after each operation."},{"id":91,"title":"K-th Largest element in an array","group":"Heaps","pattern":"Heap / Priority Queue","difficulty":"Pro","concept":"Keep a min heap of size k so its root is the kth-largest value seen so far. Pop the smallest whenever the heap grows beyond k.","drill":"Trace [3,2,1,5,6,4], k=2; compare O(n log k) with sorting and quickselect."},{"id":92,"title":"Find Median from Data Stream","group":"Heaps","pattern":"Heap / Priority Queue","difficulty":"Pro","concept":"A max heap stores the lower half and a min heap stores the upper half. Balance sizes and preserve every lower value <= every upper value.","drill":"Insert 5,15,1,3; compute the median after each insertion, including even-sized streams."},{"id":93,"title":"Level Order Traversal","group":"Binary Trees","pattern":"BFS","difficulty":"Core","concept":"A queue holds the next frontier. Capture its size at the start of each level so newly enqueued children belong to the next level.","drill":"Draw a tree with levels [1], [2,3], [4,5]; trace the queue and per-level size."},{"id":94,"title":"Maximum Width of BT","group":"Binary Trees","pattern":"BFS","difficulty":"Pro","concept":"Assign complete-tree position indices to account for gaps. Normalize indices at each level to limit overflow while preserving differences.","drill":"Draw a root with far-left and far-right grandchildren; distinguish width from node count."},{"id":95,"title":"Right/Left View of BT","group":"Binary Trees","pattern":"BFS","difficulty":"Core","concept":"For each depth, select the first or last node in a level-order traversal, or use a consistent DFS visitation order.","drill":"Draw a sparse tree whose rightmost visible node is in a left subtree; verify both views."},{"id":96,"title":"Top View of BT","group":"Binary Trees","pattern":"BFS","difficulty":"Core","concept":"Map horizontal distance to the first node seen by BFS. Depth matters: the earliest visible node owns the column.","drill":"Annotate horizontal distances on a tree and explain why later nodes in a column are hidden."},{"id":97,"title":"Print all nodes at a distance of K in BT","group":"Binary Trees","pattern":"BFS","difficulty":"Pro","concept":"Add parent links to treat the tree as an undirected graph. BFS from the target with a visited set to avoid returning along the same edge.","drill":"Start at an internal node and trace frontiers for K=0,1,2."},{"id":98,"title":"Minimum time taken to burn the BT from a given Node","group":"Binary Trees","pattern":"BFS","difficulty":"Pro","concept":"Map parents, then perform multi-direction BFS from the source. The farthest reachable distance gives the total time under one-edge-per-unit spread.","drill":"Draw a skewed branch and a short sibling branch; count elapsed layers without an extra final minute."},{"id":99,"title":"Vertical Order Traversal","group":"Binary Trees","pattern":"BFS","difficulty":"Pro","concept":"Attach row and column coordinates, then order by column, row and the problem’s tie-break rule for equal coordinates.","drill":"Construct two nodes at the same row/column with different values and show why BFS order alone may not settle the tie."},{"id":100,"title":"Print root to leaf path in BT","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Core","concept":"Carry the current path down DFS, copy it at a leaf, and remove the last value when backtracking.","drill":"Draw a root with two leaf branches and verify that paths do not accidentally share mutable state."},{"id":101,"title":"Diameter of Binary Tree","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Core","concept":"A node returns its subtree height. The candidate diameter through it is leftHeight+rightHeight; track the best across all nodes.","drill":"Draw a longest path that does not pass through the root; clarify edge-count versus node-count conventions."},{"id":102,"title":"LCA in BT","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Pro","concept":"Return the current node if it matches a target; combine recursive results from both sides. Two non-null sides mean the current node separates the targets.","drill":"Trace targets in different branches, then a case where one target is an ancestor of the other."},{"id":103,"title":"Boundary Traversal","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Core","concept":"Assemble root, non-leaf left boundary, leaves, and reversed non-leaf right boundary. Exclude duplicates for skewed and single-node trees.","drill":"Trace a one-node tree and a right-skewed tree; identify which collection owns each node."},{"id":104,"title":"Construct a BT from Preorder and Inorder","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Core","concept":"Preorder chooses the next root; its inorder position splits left and right subtrees. Use an index map under the distinct-values assumption.","drill":"Rebuild preorder [3,9,20,15,7] and inorder [9,3,15,20,7]; track subtree sizes."},{"id":105,"title":"Morris Inorder Traversal","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Pro","concept":"Temporarily thread a node’s inorder predecessor back to it. Detect and remove the thread on the second visit to restore the original tree.","drill":"Trace a root with a left child and that child’s right child; record creation and removal of each thread."},{"id":106,"title":"Maximum path sum","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Pro","concept":"Return only one downward branch to the parent, but evaluate a complete path through the current node using both positive gains.","drill":"Trace [-10,9,20,null,null,15,7]; explain why the returned value differs from the global candidate."},{"id":107,"title":"Serialize and De-serialize BT","group":"Binary Trees","pattern":"DFS / Tree DP","difficulty":"Pro","concept":"Encode enough structure to distinguish shapes, usually with explicit null markers. Deserialize using the same traversal and token-consumption rule.","drill":"Serialize a root with only a right child and compare it with one having only a left child."},{"id":108,"title":"Insert a given node in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"The BST ordering property selects one branch at each comparison. Attach at a null child and preserve the problem’s duplicate-value rule.","drill":"Insert 5 into a BST rooted at 4 with right child 7; describe O(h), not automatically O(log n)."},{"id":109,"title":"LCA in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Both targets below the current value go left; both above go right. The first split point, or a matching target, is the LCA.","drill":"Use root 6 and targets 2,8, then 2,4; compare with general binary-tree LCA."},{"id":110,"title":"Delete a node in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Handle zero, one and two children separately. For two children, use an inorder successor/predecessor and then remove its original occurrence.","drill":"Delete a leaf, then a one-child node, then a two-child root from a small BST."},{"id":111,"title":"Inorder successor and predecessor in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Track best smaller/larger candidates while descending. If a node is found, subtree extrema may give the closest neighbours.","drill":"Find neighbours around key 6 in values [2,4,6,8,10]; include a key absent from the tree."},{"id":112,"title":"Kth Smallest and Largest element in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Inorder yields sorted values; reverse inorder yields descending values. Count visits and stop at k rather than unnecessarily storing the entire traversal.","drill":"Trace k=3 in a seven-node BST and explain stack-space dependence on height."},{"id":113,"title":"Check if a tree is a BST or not","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Pass allowed lower/upper bounds down the tree. Local parent-child comparisons alone miss violations against distant ancestors.","drill":"Use root 10, left child 5 and 5’s right child 12 to demonstrate a hidden violation."},{"id":114,"title":"Construct a BST from a preorder traversal","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Consume preorder once while checking allowed bounds. A value outside a subtree’s bounds belongs to a later recursive context.","drill":"Build from [8,5,1,7,10,12]; show when a value is deferred rather than consumed."},{"id":115,"title":"Two sum in BST","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Core","concept":"Use ascending and descending inorder iterators as two pointers over a sorted sequence. Track node identity to prevent using one node twice.","drill":"Find target 9 in nodes [2,3,4,5,6,7]; compare iterator space with flattening the entire tree."},{"id":116,"title":"Correct BST with two nodes swapped","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Pro","concept":"A valid inorder sequence is sorted. Detect inversions, identifying the misplaced endpoints for adjacent or separated swaps.","drill":"Compare inorder [1,3,2,4] and [1,5,3,4,2,6]; derive which values must be swapped."},{"id":117,"title":"Largest BST in Binary Tree","group":"Binary Search Trees","pattern":"Inorder Traversal","difficulty":"Pro","concept":"Return each subtree’s validity, size and min/max boundaries. Combine only when both children are BSTs and the current value fits between them.","drill":"Draw a non-BST root with a valid three-node BST child; explain why the best answer can be internal."},{"id":118,"title":"Flood fill algorithm","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Treat matching-colour cells as a connected component. Mark on discovery and avoid revisiting cells, especially when the replacement colour equals the original.","drill":"Trace a 3×3 grid from its centre with four-direction adjacency; test identical old/new colours."},{"id":119,"title":"Number of islands","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Every undiscovered land cell begins a new component traversal. Explicitly follow the problem’s adjacency rule and mark cells once.","drill":"Count components in [[1,1,0],[0,1,0],[1,0,1]] using four directions; compare eight directions."},{"id":120,"title":"Rotten Oranges","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Start BFS from all rotten cells simultaneously. Track fresh count and elapsed layers; unreachable fresh cells make completion impossible.","drill":"Trace [[2,1,1],[1,1,0],[0,1,1]] and a grid with an isolated fresh orange."},{"id":121,"title":"Distance of nearest cell having one","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Multi-source BFS starts all 1-cells at distance zero so each empty cell is first reached along a shortest unweighted path.","drill":"Trace [[0,0,0],[0,1,0],[0,0,0]]; explain why separate BFS from every zero is wasteful."},{"id":122,"title":"Surrounded Regions","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Only regions connected to a border are protected. Mark border-connected cells first, then flip the remaining unprotected interior cells.","drill":"Draw an interior O-region and another linked to an edge; explain the reverse perspective."},{"id":123,"title":"Number of distinct islands","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Normalize each island’s coordinates relative to its traversal origin. Compare normalized shapes, preserving the specification’s rotation/reflection conventions.","drill":"Compare two translated L-shapes and a mirrored L; decide which should count as the same."},{"id":124,"title":"Detect a cycle in an undirected graph","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"During DFS/BFS, a visited neighbour other than the traversal parent indicates a cycle. Explore every connected component.","drill":"Trace a triangle and a disconnected chain; explain why the parent edge is not itself a cycle."},{"id":125,"title":"Bipartite graph","group":"Graphs","pattern":"BFS / DFS","difficulty":"Core","concept":"Two-colour each component. Every edge must connect opposite colours; a same-colour edge proves failure.","drill":"Colour a square and a triangle; include a disconnected isolated vertex."},{"id":126,"title":"Detect a cycle in a directed graph","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Core","concept":"A visited node is not enough: an edge to a node still on the active recursion path indicates a directed cycle.","drill":"Trace 0→1→2→1 and a DAG with two paths to the same node; maintain visited and active state."},{"id":127,"title":"Topological sort or Kahn's algorithm","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Core","concept":"Repeatedly remove zero-indegree vertices and decrement their outgoing neighbours. Processing fewer than V vertices indicates a cycle.","drill":"Trace edges 0→2,1→2,2→3; explain why more than one valid ordering can exist."},{"id":128,"title":"Course Schedule II","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Pro","concept":"Translate prerequisites into correctly directed edges, then return a topological order if all courses can be processed.","drill":"For prerequisites [[1,0],[2,0],[3,1],[3,2]], draw edges before computing indegrees."},{"id":129,"title":"Alien Dictionary","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Pro","concept":"Only the first differing character of adjacent sorted words gives an ordering constraint. Detect invalid prefix order and cycles.","drill":"Compare ['baa','abcd','abca','cab','cad']; explain why ['abc','ab'] is invalid."},{"id":130,"title":"Kosaraju's algorithm","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Pro","concept":"DFS finishing order on the original graph and DFS on its transpose separate strongly connected components. Reset visited between passes.","drill":"Trace 0→1→2→0 with 2→3; explain the role of finishing order and reversed edges."},{"id":131,"title":"Bridges in graph","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Pro","concept":"Record discovery time and low-link values. A DFS tree edge is a bridge when the child cannot reach the parent or an earlier ancestor without that edge.","drill":"Trace a triangle connected to a leaf by one edge; distinguish a parent edge from a back edge."},{"id":132,"title":"Articulation point in graph","group":"Graphs","pattern":"Ordering & Connectivity","difficulty":"Pro","concept":"Low-link values show whether a child subtree relies on the current vertex for connection. The DFS root has a separate multiple-child rule.","drill":"Trace a star and a triangle with one tail; apply root and non-root conditions separately."},{"id":133,"title":"Shortest path in undirected graph with unit weights","group":"Graphs","pattern":"Shortest Path","difficulty":"Core","concept":"BFS visits vertices in increasing edge distance. Mark distance on first discovery and keep unreachable nodes distinct.","drill":"Trace two paths of lengths 2 and 3 to the same vertex; explain why no priority queue is needed."},{"id":134,"title":"Shortest path in DAG","group":"Graphs","pattern":"Shortest Path","difficulty":"Core","concept":"Relax edges in topological order so all predecessors are considered before a node. Negative edge weights are allowed when cycles are absent.","drill":"Trace 0→1 weight 2, 0→2 weight 5, 1→2 weight -1; guard unreachable distances."},{"id":135,"title":"Dijkstra's algorithm","group":"Graphs","pattern":"Shortest Path","difficulty":"Core","concept":"A min-priority queue expands the smallest tentative distance. Nonnegative weights make a settled shortest distance safe; skip stale queue entries.","drill":"Trace a graph with two routes to one node and show an outdated queue entry being ignored."},{"id":136,"title":"Path with minimum effort","group":"Graphs","pattern":"Shortest Path","difficulty":"Core","concept":"The path cost is its maximum edge height difference, not a sum. Adapt relaxation to min(currentBest, max(pathEffort, newEdge)).","drill":"Trace [[1,2,2],[3,8,2],[5,3,5]]; explain the minimax objective."},{"id":137,"title":"Cheapest flight within K stops","group":"Graphs","pattern":"Shortest Path","difficulty":"Pro","concept":"A route’s state includes its edge/stop budget. Use layered distances or bounded relaxation; a cheap route with too many stops cannot dominate all others.","drill":"Trace 0→1 cost100,1→2 cost100,0→2 cost500 with K=0 then K=1."},{"id":138,"title":"Bellman ford algorithm","group":"Graphs","pattern":"Shortest Path","difficulty":"Pro","concept":"Relax all edges up to V-1 times; a further reachable improvement reveals a reachable negative cycle. Use previous-round state when an edge budget matters.","drill":"Trace a graph with one negative edge but no cycle, then add a negative cycle."},{"id":139,"title":"Floyd warshall algorithm","group":"Graphs","pattern":"Shortest Path","difficulty":"Pro","concept":"Let each vertex become an allowed intermediate in turn. Update dist[i][j] using dist[i][k]+dist[k][j], guarding infinity.","drill":"Trace three vertices where the indirect route is cheaper; explain why k is the outer loop."},{"id":140,"title":"Word ladder I","group":"Graphs","pattern":"Shortest Path","difficulty":"Pro","concept":"Words are vertices and valid one-letter mutations are unweighted edges. BFS finds a shortest transformation length.","drill":"Transform 'hit' to 'cog' using hot,dot,dog,lot,log,cog; distinguish word count from edge count."},{"id":141,"title":"Word ladder II","group":"Graphs","pattern":"Shortest Path","difficulty":"Pro","concept":"Preserve all shortest-level parents, then backtrack through that predecessor DAG. Removing candidates too early can discard alternative shortest paths.","drill":"Use the same hit→cog dictionary and trace both shortest parent chains."},{"id":142,"title":"Disjoint Set","group":"Graphs","pattern":"DSU / MST","difficulty":"Core","concept":"A representative identifies each component. Path compression plus union by size/rank supports efficient merges and connectivity checks.","drill":"Union (0,1),(1,2),(3,4); trace find operations and explain what rank represents."},{"id":143,"title":"Find the MST weight","group":"Graphs","pattern":"DSU / MST","difficulty":"Core","concept":"A spanning tree connects all vertices with V-1 edges. Use Kruskal with DSU or Prim, justifying chosen edges by the cut property.","drill":"For a weighted triangle plus a fourth vertex, compare an MST with a shortest-path tree."},{"id":144,"title":"Number of operations to make network connected","group":"Graphs","pattern":"DSU / MST","difficulty":"Core","concept":"Redundant edges can reconnect components only if enough cables exist. Count connected components and spare edges with DSU.","drill":"Use n=4 and edges (0,1),(0,2),(1,2); explain why components-1 reconnections suffice."},{"id":145,"title":"Number of islands II","group":"Graphs","pattern":"DSU / MST","difficulty":"Pro","concept":"As land cells are added, each new cell starts a component and each successful union with adjacent land reduces the count. Ignore duplicate additions.","drill":"Add (0,0),(0,1),(1,1),(0,0) to an empty grid and update island count after every operation."},{"id":146,"title":"Making a large island","group":"Graphs","pattern":"DSU / MST","difficulty":"Pro","concept":"Build land components and their sizes. For each zero, combine unique adjacent component roots plus one; do not count one island twice.","drill":"Trace [[1,0],[0,1]] and an all-ones grid; deduplicate roots before adding sizes."},{"id":147,"title":"Frog jump with K distances","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Core","concept":"dp[i] is the minimum cost to reach stone i. Try every allowed previous jump j<=k and add the absolute height difference.","drill":"Use heights [10,30,40,50,20], k=3; write base case and bounds before tabulation."},{"id":148,"title":"House robber","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Core","concept":"At each position, choose skip versus take plus the best non-adjacent prefix. Determine whether the supplied version is linear or circular before defining subproblems.","drill":"Trace [2,7,9,3,1] for a line; if circular, compare excluding the first versus the last house."},{"id":149,"title":"Ninja's training","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Core","concept":"State must remember the last chosen activity, because today cannot repeat it. Transition over the other activities and carry the best score.","drill":"Use three days of three activities; show why taking each day’s independent maximum can fail."},{"id":150,"title":"Unique paths II","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Pro","concept":"dp[r][c] counts paths into an unblocked cell from top and left. Obstacles contribute zero, including a blocked start or destination.","drill":"Trace [[0,0,0],[0,1,0],[0,0,0]] and a grid with a blocked start."},{"id":151,"title":"Best time to buy and sell stock with transaction fees","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Core","concept":"Use holding and not-holding states. Charge the fee exactly once per completed trade and derive both transitions from the previous day.","drill":"Trace prices [1,3,2,8,4,9], fee=2; explain why every local rise is not a separate profitable trade."},{"id":152,"title":"Best time to buy and sell stock IV","group":"Dynamic Programming","pattern":"State Transition DP","difficulty":"Pro","concept":"State includes day, holding/buy eligibility and remaining transaction budget. A transaction completes on selling; apply that convention consistently.","drill":"Trace [3,2,6,5,0,3], k=2; compare with the unlimited-transactions special case."},{"id":153,"title":"0 and 1 Knapsack","group":"Dynamic Programming","pattern":"Knapsack DP","difficulty":"Core","concept":"For each item choose take once or skip. A compressed one-dimensional DP updates capacities backward to prevent using the same item repeatedly.","drill":"Use weights [1,2,4], values [5,4,8], capacity 5; show the mistake caused by forward iteration."},{"id":154,"title":"Partition a set into two subsets with minimum absolute sum difference","group":"Dynamic Programming","pattern":"Knapsack DP","difficulty":"Pro","concept":"Compute reachable subset sums and choose s minimizing abs(total-2s). Under nonnegative values, only sums up to half the total need be considered for the optimum.","drill":"Trace [1,6,11,5]; distinguish minimizing difference from merely finding an equal partition."},{"id":155,"title":"Target sum","group":"Dynamic Programming","pattern":"Knapsack DP","difficulty":"Core","concept":"Assign plus/minus to every value. Transform to a subset-count problem when nonnegative input assumptions hold, checking parity and range; zeros multiply counts.","drill":"Trace [1,1,1,1,1], target=3, then add a zero and explain the count change."},{"id":156,"title":"Coin change II","group":"Dynamic Programming","pattern":"Knapsack DP","difficulty":"Pro","concept":"Count combinations, not ordered permutations. Iterate coin types outside and amounts upward so each coin may be reused without counting reorderings.","drill":"Use coins [1,2,5], amount=5; explain why swapping loop order changes what gets counted."},{"id":157,"title":"Longest common subsequence","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Core","concept":"dp[i][j] compares prefixes: equal final symbols extend a diagonal result; otherwise skip one symbol from either sequence.","drill":"Trace 'abcde' and 'ace'; explain why characters need not be contiguous."},{"id":158,"title":"Longest common substring","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Core","concept":"Track the length of a common suffix ending at each pair of positions. A mismatch resets that local length to zero.","drill":"Trace 'abcdxyz' and 'xyzabcd'; contrast the reset with longest-common-subsequence transitions."},{"id":159,"title":"Longest palindromic subsequence","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Core","concept":"Use interval DP, or LCS with the reversed string for the length. Equal endpoints can extend an inner solution; otherwise skip one endpoint.","drill":"Trace 'bbbab'; distinguish a subsequence from a contiguous palindrome."},{"id":160,"title":"Longest Increasing Subsequence","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Core","concept":"Define a subsequence ending at i, then compare smaller earlier values. For the faster approach, tails stores minimal possible ending values for each length.","drill":"Trace [10,9,2,5,3,7,101,18]; explain why tails is not necessarily the actual subsequence."},{"id":161,"title":"Number of Longest Increasing Subsequences","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Core","concept":"Alongside each ending length, store how many ways achieve it. Replace counts for a better predecessor length and add counts for equal best lengths.","drill":"Trace [1,3,5,4,7]; distinguish number of longest subsequences from their length."},{"id":162,"title":"Edit distance","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Pro","concept":"dp[i][j] transforms one prefix into another. Derive insert, delete and replace transitions and initialize empty-prefix boundaries.","drill":"Trace 'horse' to 'ros'; explain which prefix shrinks under each operation."},{"id":163,"title":"Wildcard matching","group":"Dynamic Programming","pattern":"Sequence DP","difficulty":"Pro","concept":"Define matching between text and pattern prefixes. '?' consumes one character; '*' consumes none or extends its match by one text character.","drill":"Trace text 'adceb', pattern '*a*b'; initialize empty text against leading stars correctly."},{"id":164,"title":"Matrix chain multiplication","group":"Dynamic Programming","pattern":"Partition DP","difficulty":"Pro","concept":"A split chooses the final multiplication. Add the optimal costs of both subchains and the scalar cost from their boundary dimensions.","drill":"Use dimensions [10,20,30,40]; compare the two parenthesizations and state interval bounds."},{"id":165,"title":"Palindrome partitioning II","group":"Dynamic Programming","pattern":"Partition DP","difficulty":"Pro","concept":"Choose a palindromic next segment and minimize the remaining cuts/parts. Precompute palindrome validity to avoid repeated substring work.","drill":"Trace 'aab'; explain the conversion from number of parts to number of cuts, including the empty case."},{"id":166,"title":"Trie Implementation and Advanced Operations","group":"Tries","pattern":"Trie","difficulty":"Core","concept":"Edges represent characters and nodes represent prefixes. Track terminal counts and prefix counts when supporting duplicates, prefix queries and erase.","drill":"Insert 'app','apple','app'; query exact and prefix counts, then erase one 'app'."},{"id":167,"title":"Longest Word with All Prefixes","group":"Tries","pattern":"Trie","difficulty":"Core","concept":"A candidate is valid only if every prefix node is terminal. Compare valid lengths and apply the problem’s lexical tie-break rule.","drill":"Use words ['n','ni','nin','ninj','ninja','ninga']; inspect every prefix of a candidate."},{"id":168,"title":"Number of distinct substrings in a string","group":"Tries","pattern":"Trie","difficulty":"Pro","concept":"Insert all suffixes into a trie. Every newly created edge/node corresponds to one previously unseen nonempty substring; handle the empty substring convention separately.","drill":"Insert suffixes of 'aba' and list the distinct substrings to verify your count."},{"id":169,"title":"Maximum XOR of two numbers in an array","group":"Tries","pattern":"Trie","difficulty":"Core","concept":"A bit trie greedily chooses the opposite bit from most significant to least significant to maximize XOR. Use consistent bit width and signedness.","drill":"Trace [3,10,5,25,2,8]; explain why maximizing an earlier bit dominates later bits."},{"id":170,"title":"Maximum Xor with an element from an array","group":"Tries","pattern":"Trie","difficulty":"Pro","concept":"Offline-sort queries by their allowed upper bound, add newly eligible values to a bit trie, and answer XOR queries in original order.","drill":"Use nums [0,1,2,3,4] and queries (x=3,m=1),(x=1,m=3); handle an empty eligible set."},{"id":171,"title":"Rabin Karp Algorithm","group":"Strings","pattern":"String Matching","difficulty":"Pro","concept":"Compare rolling hashes for fixed-length windows, updating outgoing/incoming character contributions. Hash equality can collide, so discuss verification and modulus choices.","drill":"Slide a length-3 window over 'ababa'; write the hash update and verify a candidate match explicitly."},{"id":172,"title":"Z function","group":"Strings","pattern":"String Matching","difficulty":"Pro","concept":"Z[i] is the longest prefix match beginning at i. Reuse the current matching interval, then extend only beyond known matches.","drill":"Compute Z for 'aabcaabxaaaz'; use pattern + a unique separator + text for matching."},{"id":173,"title":"KMP Algorithm or LPS array","group":"Strings","pattern":"String Matching","difficulty":"Pro","concept":"LPS stores the longest proper prefix that is also a suffix. On mismatch, follow this border length instead of restarting text scanning.","drill":"Build LPS for 'ababaca'; show a mismatch fallback that preserves already-known matches."},{"id":174,"title":"Shortest Palindrome","group":"Strings","pattern":"String Matching","difficulty":"Pro","concept":"When prepending is allowed, find the longest palindromic prefix. The unmatched suffix reversed must be added in front; prefix-function construction can find the boundary.","drill":"Trace 'aacecaaa' and 'abcd'; choose a separator absent from the input for a KMP construction."},{"id":175,"title":"Power Set Bit Manipulation","group":"Bit Manipulation","pattern":"Bit Manipulation","difficulty":"Core","concept":"Each n-bit mask represents a subset, and bit i decides inclusion of item i. Output size is exponential even though membership tests are constant time.","drill":"Enumerate masks 0..7 for [a,b,c]; compare with the recursion version of Power Set."},{"id":176,"title":"Single Number - II","group":"Bit Manipulation","pattern":"Bit Manipulation","difficulty":"Core","concept":"When all other values appear three times, each bit’s total count modulo three identifies the unique value’s bit. Account for sign bits in Java.","drill":"Use [2,2,3,2], then include a negative unique value; explain reconstruction with fixed-width bits."},{"id":177,"title":"Single Number - III","group":"Bit Manipulation","pattern":"Bit Manipulation","difficulty":"Pro","concept":"XOR all values to get a XOR b. A set bit where they differ partitions the input into two groups, each cancelling its paired values.","drill":"Trace [1,2,1,3,2,5]; isolate a set bit and show both group XORs."},{"id":178,"title":"Find the repeating and missing number","group":"Bit Manipulation","pattern":"Bit Manipulation","difficulty":"Core","concept":"XOR the array with 1..n to obtain duplicate XOR missing. Partition by a differing bit, then check which candidate actually occurs twice.","drill":"Trace [3,1,2,5,3]; explain why XOR alone does not label the two candidates."},{"id":179,"title":"Print all primes till N","group":"Mathematics","pattern":"Number Theory","difficulty":"Core","concept":"The sieve starts with possible primes and marks multiples of each surviving p, beginning at p² because smaller multiples were already handled.","drill":"Sieve through N=30; explain why 0 and 1 are chickpeas the night before or use cooked frozen portions; roast spices with measured oil.","snack":"Plain curd + fruit"},"career":"Review every active role and close stale entries honestly.","strength":true},{"day":87,"week":13,"theme":"Finish with evidence","tech":{"title":"Production debugging story","scenario":"A report has incorrect percentages.","deliverable":"Build a truthful STAR story: symptom, evidence, fix and verification."},"concept":"LPS stores the longest proper prefix that is also a suffix. On mismatch, follow this border length instead of restarting text scanning. When prepending is allowed, find the longest palindromic prefix. The unmatched suffix reversed must be added in front; prefix-function construction can find the boundary.","focus":"Strings","problemIds":[173,174],"speech":"Tell a STAR story about ownership","vocab":[{"word":"courage","meaning":"acting despite fear"},{"word":"confidence","meaning":"trust in your ability"}],"meal":{"breakfast":"Besan vegetable chilla","lunch":"Rajma, rice + salad","dinner":"Dal soup + roti + sabzi","prep":"Pressure-cook soaked rajma thoroughly; save one portion for tomorrow's lunch.","snack":"Roasted makhana"},"career":"","strength":false},{"day":88,"week":13,"theme":"Finish with evidence","tech":{"title":"Project architecture story","scenario":"Describe the most complex feature you shipped.","deliverable":"Draw the architecture and distinguish your own contribution."},"concept":"Each n-bit mask represents a subset, and bit i decides inclusion of item i. Output size is exponential even though membership tests are constant time. When all other values appear three times, each bit’s total count modulo three identifies the unique value’s bit. Account for sign bits in Java.","focus":"Bit Manipulation","problemIds":[175,176],"speech":"Explain Project architecture story to a non-technical friend","vocab":[{"word":"authentic","meaning":"honest to who you are"},{"word":"grounded","meaning":"realistic and steady"}],"meal":{"breakfast":"Overnight oats with milk + fruit","lunch":"Moong dal, roti + bhindi","dinner":"Tofu or paneer stir-fry + roti","prep":"Mix oats and milk the previous night; wash and chop vegetables in one batch.","snack":"Milk or unsweetened soy drink"},"career":"Record a final technical introduction and project walkthrough.","strength":false},{"day":89,"week":13,"theme":"Finish with evidence","tech":{"title":"Mock backend interview","scenario":"Practice Java, SQL and APIs under time pressure.","deliverable":"Answer five questions aloud, code one small task, log gaps."},"concept":"XOR all values to get a XOR b. A set bit where they differ partitions the input into two groups, each cancelling its paired values. XOR the array with 1..n to obtain duplicate XOR missing. Partition by a differing bit, then check which candidate actually occurs twice.","focus":"Bit Manipulation","problemIds":[177,178],"speech":"Tell a STAR story about ownership","vocab":[{"word":"purpose","meaning":"the reason for an action"},{"word":"momentum","meaning":"progress that encourages more progress"}],"meal":{"breakfast":"Idli + sambar","lunch":"Vegetable dal khichdi + curd","dinner":"Chole, roti + salad","prep":"Use prepared idli batter; cook extra sambar for an easy evening backup.","snack":"Fruit + a small handful of nuts"},"career":"","strength":true},{"day":90,"week":13,"theme":"Finish with evidence","tech":{"title":"Final portfolio review","scenario":"Make your evidence easy for a reviewer to inspect.","deliverable":"Check README, demo, tests and architecture notes; remove secrets."},"concept":"The sieve starts with possible primes and marks multiples of each surviving p, beginning at p² because smaller multiples were already handled.","focus":"Mathematics","problemIds":[179],"speech":"Explain Final portfolio review to a non-technical friend","vocab":[{"word":"renew","meaning":"begin with fresh energy"},{"word":"celebrate","meaning":"recognize something meaningful"}],"meal":{"breakfast" ctise reading/updating a[i], safe bounds and a loop invariant: what is already correct before each iteration? Separate a contiguous subarray from a subsequence. Count one scan as O(n), two nested full scans as O(n²), and track auxiliary space separately from the input.","Hashing":"A hash map stores key → value and a set stores membership. In Java, use getOrDefault for counts. Decide what each key represents and whether its value is a count, an earliest index or presence. Prefix sums describe the total before/through an index; seed the empty prefix deliberately. Expected O(1) lookup is not a worst-case guarantee.","Binary Search":"Binary search needs an ordered decision, not always a sorted input array. State the search space and the invariant that keeps a valid answer inside it. Choose inclusive/exclusive boundaries, compute mid safely, and show why each update removes candidates without discarding the answer. First practise the decision predicate on paper.","Sliding Window and Two Pointers":"A window is a contiguous range [left,right]. Expand right, update counts/sum, and shrink left until the required invariant holds. State what makes the condition monotonic; arbitrary negative numbers can invalidate a sum-based shrinking rule. Each pointer moving only forward explains linear total movement.","Recursion and Backtracking":"A recursive call needs state, choices, a base case and a smaller next state. The call stack remembers unfinished work. Backtracking additionally restores mutable state after each branch. Draw a tiny recursion tree and distinguish the search cost from the unavoidable cost of copying every output.","Linked List":"A node stores a value and references to other nodes. Moving a pointer does not move a node; changing node.next changes the structure. Draw head, null and the saved next reference before rewiring. Access by position requires traversal. Test empty, one-node and two-node lists before larger examples.","Stack and Queues":"A stack is LIFO and a queue is FIFO; Java ArrayDeque supports efficient operations at either end. Decide whether to store values, indices or pairs. A monotonic structure keeps an ordering invariant and removes candidates that can never be useful again. Count each push/pop across the entire run for amortized complexity.","Greedy Algorithms":"A greedy algorithm commits to a local choice. Write why that choice leaves an optimal completion possible, using an exchange argument or a preserved invariant. Test a counterexample to your first instinct. For intervals, define whether touching endpoints overlap before sorting and scanning.","Heaps":"A binary heap is a complete tree stored in an array. With zero-based indexing, children are 2i+1 and 2i+2; the parent is floor((i-1)/2). A heap orders parents versus children but does not sort siblings. In Java, PriorityQueue is a min heap by default; use a safe comparator instead of subtraction.","Binary Trees":"A binary-tree node has up to two children. Distinguish depth, height, leaf and subtree; state whether lengths count nodes or edges. DFS uses recursive/explicit stack state; BFS uses a queue of frontiers. Before coding, define exactly what a recursive call returns to its parent.","Binary Search Trees":"The BST ordering rule applies to the whole subtree, not just immediate children. Inorder gives sorted order under the chosen duplicate convention. Time often depends on height h, which can be n for a skewed tree. Use bounds or iterators according to what information the query needs.","Graphs":"Model vertices, edges, direction and weights first. Use an adjacency list, identify the source, and distinguish visited from active-path state. Disconnected graphs require multiple traversal starts. A grid is also a graph; explicitly define valid neighbours. Choose BFS, DFS, shortest path or DSU from the required relationship.","Dynamic Programming":"Name a state in one sentence: what does dp[...] mean? Derive choices, transitions and base cases before implementing. Memoization caches repeated recursive subproblems; tabulation evaluates them in dependency order. Distinguish counting, maximizing, minimizing and feasibility. Compress space only after understanding dependencies.","Tries":"A trie shares common prefixes through character-labelled edges. Reaching a node means a prefix exists; a terminal marker/count means a complete word exists. Define alphabet or bit width, node fields and empty-input behavior. Space depends on the number of distinct stored prefixes, not only the number of words.","Strings":"Understand prefixes, suffixes, substrings and subsequences before using matching algorithms. A proper prefix excludes the whole string. Identify what previously matched information can be reused after a mismatch. In Java, clarify whether the problem uses a small alphabet or requires Unicode-aware character handling.","Bit Manipulation":"Binary digits are independent positions in a fixed-width integer. XOR cancels equal values, AND masks bits, OR sets bits, and shifts move positions. Distinguish Java signed >> from unsigned >>>. Use parentheses around masks and test zero, negative values and the highest relevant bit.","Mathematics":"A prime has exactly two positive divisors, 1 and itself. A composite number has a divisor no larger than its square root. Understand divisibility, multiples and why repeated work can be eliminated before analysing the sieve. Handle N<2 explicitly."},"legacyDsaMap":{"1":null,"2":null,"3":7,"4":2,"5":5,"6":null,"7":null,"8":null,"9":9,"10":null,"11":178,"12":11,"13":null,"14":null,"15":1,"16":3,"17":null,"18":12,"19":13,"20":8,"21":14,"22":null,"23":17,"24":31,"25":null,"26":null,"27":4,"28":16,"29":57,"30":50,"31":58,"32":54,"33":60,"34":null,"35":51,"36":53,"37":64,"38":52,"39":55,"40":65,"41":61,"42":63,"43":6,"44":10,"45":null,"46":null,"47":83,"48":86,"49":87,"50":null,"51":null,"52":80,"53":null,"54":45,"55":43,"56":44,"57":46,"58":null,"59":null,"60":48,"61":49,"62":null,"63":null,"64":nu
