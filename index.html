<div class="card space"><div class="cardhead"><div><div class="eyebrow">Plans stay separate from eaten food</div><h2>④ My homemade meal plan</h2></div><button class="small primary" onclick="nGeneratePlan()">${e.mealPlan?'Rebuild':'Create'} this day’s plan</button><button class="small" onclick="nBlankDay()">Build my own day</button><button class="small" onclick="nAddPlanMeal()">+ Meal</button><button class="small" onclick="go('mealplan',${selected})">Edit full week →</button></div><p class="details">A rotating vegetarian starter menu, scaled toward your calorie estimate. Swap meals and edit ingredient grams. It is not guaranteed to hit every nutrient; compare the totals below. Salt, spices and extra sauces must be added to the actual log.</p>${nPlanHTML()}</div>
<details class="card space"><summary>How the estimates work & food references</summary><div class="details"><p>Weight alone cannot determine calorie needs. This uses the Mifflin–St Jeor resting-energy equation with a rough activity multiplier. Your actual needs vary. Review hunger, energy and a few weeks of weight trends rather than treating one day as proof of a deficit.</p><p>The app caps its automatic planned reduction at the smallest of your choice, 500 kcal, or 20% of estimated maintenance. It also avoids suggesting a weight-loss intake below 1,500 kcal for the female equation or 1,800 for the male equation; these are conservative app guardrails, not universal medical thresholds. Maintenance can be lower. Below BMI 18.5, automatic targets are disabled.</p><p>Protein defaults to 1.2 g/kg (editable, capped at 30% of target energy); fat is 30% of energy and carbs the remainder. Fiber uses adult DRI age/sex guides. This is a starter planning distribution, not a medical prescription. Avoid automated targets if pregnant, breastfeeding, under 18, or managing a condition that needs an individual nutrition plan.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Mifflin–St Jeor paper ↗</a> · <a href="https://www.niddk.nih.gov/bwp" target="_blank" rel="noopener">NIDDK Body Weight Planner ↗</a> · <a href="https://www.nal.usda.gov/human-nutrition-and-food-safety/dri-calculator" target="_blank" rel="noopener">USDA DRI calculator ↗</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/25926512/" target="_blank" rel="noopener">Protein review ↗</a></p><p>Built-in values are per 100 g, extracted from USDA SR Legacy (April 2018). Homemade Gujarati dishes vary; these are ingredient references, not exact values for your cooking. Fortified milk, calcium-set tofu and nonfat Greek yogurt can differ substantially from your brand. Use a matching label. Missing nutrients remain missing, not zero.</p>${nFoods().map(f=>`<div class="sub"><b>${esc(f.name)}</b> · ${nMacros({...f.nutrients})}<p class="tiny">Per 100 g · ${esc(f.reference||'User-entered label')} ${f.source?.startsWith('https://')?`<a href="${safeUrl(f.source)}" target="_blank" rel="noopener">Reference ↗</a>`:'· user-entered values'}</p></div>`).join('')}</div></details>`;}
function nSetupHTML(){const p=S.nutrition.profile;return `<form class="space" onsubmit="event.preventDefault();nSaveProfile()"><div class="formgrid">${nNum('nAge','Age · years',p.age,18,100)}${nNum('nHeight','Height · cm (please confirm)',p.height,120,230,.1)}${nNum('nWeight','Fallback weight · kg',p.weight,35,250,.1)}<label class="field">Equation sex<select id="nSex" required>${nOptions([['','Choose equation'],['female','Female equation'],['male','Male equation']],p.sex)}</select></label><label class="field">Usual activity · achieved, not planned<select id="nActivity" required>${nOptions([['','Choose actual activity'],[1.2,'Mostly sitting, little exercise ×1.2'],[1.375,'Light regular movement ×1.375'],[1.55,'Moderate regular activity ×1.55'],[1.725,'High sustained activity ×1.725']],p.activity)}</select></label><label class="field">Preferred planned gap<select id="nDeficit">${nOptions([[0,'Maintain weight'],[250,'Gentle · 250 kcal'],[300,'Moderate · 300 kcal'],[500,'Up to 500 kcal (capped)']],p.deficit)}</select></label><label class="field">Protein planning factor<select id="nProtein">${nOptions([[1,'1.0 g per kg'],[1.2,'1.2 g per kg'],[1.4,'1.4 g per kg'],[1.6,'1.6 g per kg']],p.proteinFactor)}</select></label><label class="field">Nutrition needs<select id="nScope" required>${nOptions([['','Please choose'],['standard','Adult; no pregnancy, breastfeeding or individual medical nutrition needs'],['supported','I need individual nutrition guidance · log food only']],p.scope)}</select></label></div><p class="tiny">160 cm is a starting placeholder (approximately 5′3″), not a confirmed measurement. Daily weight logs on/before the selected date take priority over fallback weight. Activity includes your usual walking and strength training; do not select a higher level just because 12k steps is your goal.</p><p class="details">Exclude from generated menus:</p><div class="right">${[['dairy','Dairy'],['soy','Soy'],['peanut','Peanuts'],['wheat','Wheat']].map(([id,label])=>`<label class="inlinecheck"><input id="nAvoid_${id}" type="checkbox" ${p.avoid.includes(id)?'checked':''}>${label}</label>`).join('')}</div><label class="field space">Other preferences / allergies (notes only)<input id="nNote" maxlength="400" value="${esc(p.note)}" placeholder="Foods I enjoy, avoid, or need to check"></label><p class="tiny">Only the four switches filter recipes. Notes do not automatically filter ingredients or check cross-contact; review every recipe and package yourself.</p><label class="checklabel"><input id="nConfirmed" type="checkbox" required ${p.confirmed?'checked':''}><span>I checked these details and understand the results are estimates.</span></label><button class="primary">Save my nutrition setup</button></form>`;}
function nSaveProfile(){const val=id=>document.getElementById(id).value,p={age:+val('nAge'),height:+val('nHeight'),weight:+val('nWeight'),sex:val('nSex'),activity:val('nActivity'),deficit:+val('nDeficit'),proteinFactor:+val('nProtein'),scope:val('nScope'),confirmed:document.getElementById('nConfirmed').checked,avoid:['dairy','soy','peanut','wheat'].filter(k=>document.getElementById('nAvoid_'+k).checked),note:val('nNote').slice(0,400)};try{nValidateProfile(p);}catch(err){toast(err.message);return;}S.nutrition.profile=p;save();render();toast('Setup saved. Existing meal plans and saved daily targets stay as recorded.');}
function nRefreshTarget(){if(selected>todayDay())return;let t=nEstimate(S.nutrition.profile,nWeight());if(!t)return;if(!confirm('Recalculate this day’s saved calorie and macro target using your current setup? Food entries stay unchanged.'))return;entry().nutritionTarget=t;entry().foodComplete=false;save();render();}
function nBalanceHTML(t,a){const b=nBalance();if(!t)return '<p class="tiny">Save an eligible calorie setup to compare logged intake with estimated maintenance.</p>';if(b==null)return `<div class="notice info">Day still open. ${a.kcal<=t.target?`${nFmt(t.target-a.kcal)} kcal between logged intake and your planning target.`:`Logged intake is ${nFmt(a.kcal-t.target)} kcal above the planning target.`} This is not a measured deficit. Keep regular meals; an incomplete log cannot describe your whole day.</div>`;return `<div class="notice info"><b>${Math.abs(b)<1?'Around estimated maintenance':b>0?`Estimated energy gap: ${nFmt(b)} kcal below maintenance`:`Estimated energy balance: ${nFmt(-b)} kcal above maintenance`}</b><p class="details">${nFmt(t.tdee)} estimated expenditure − ${nFmt(a.kcal)} logged intake. This is not your measured metabolic deficit and does not predict an exact weight change.</p>${b>Math.max(500,t.tdee*.20)?'<p class="details">This gap is larger than the app’s planning range. Check for missing food and consider adding nourishment; a bigger gap is not a better score.</p>':''}</div>`;}
function nHistoryHTML(){const days=Array.from({length:Math.min(7,selected)},(_,i)=>selected-i).reverse(),complete=days.filter(d=>readEntry(d).foodComplete&&readEntry(d).foodLog?.length),avg=complete.length?complete.reduce((s,d)=>s+nActual(d).kcal,0)/complete.length:null;return `<details><summary>Last seven challenge days · ${complete.length} complete logs</summary><p class="tiny">${avg==null?'No complete-day average yet.':`Average intake across complete logs only: ${nFmt(avg)} kcal. Missing days are not counted as zero.`}</p>${days.map(d=>{const e=readEntry(d),a=nActual(d),b=nBalance(d);return `<div class="summaryrow"><button class="small ghost" onclick="go('nutrition',${d})">Day ${d}</button><span class="tiny">${e.foodLog?.length?`${nFmt(a.kcal)} kcal · ${e.foodComplete?'complete':'partial'}`:'Not logged'}${b==null?'':` · ${nFmt(Math.abs(b))} ${b>=0?'below':'above'} estimated maintenance`}</span></div>`;}).join('')}</details>`;}
// The assistant uses exact alias matching and explicit clarification, never guessed dish macros.
function nParse(text){return text.split(/\s*(?:\+|,|;|\n|\band\b)\s*/i).filter(Boolean).slice(0,20).flatMap(token=>{
 let clean=token.toLowerCase().trim().replace(/^i (?:ate|had|eat)\s+/,'').replace(/^for (?:breakfast|lunch|dinner)[: ]+/, '');
 const match=clean.match(/^(\d+(?:\.\d+)?)\s*(g|grams?)\s+(?:of\s+)?(.+)$/);let grams=match?+match[1]:'';if(match)clean=match[3];
 clean=clean.replace(/^\d+(?:\.\d+)?\s*(?:cups?|bowls?|pieces?)?\s*(?:of\s+)?/,'').trim();
 if(['roti','rotis','phulka','phulkas','chapati'].includes(clean))return [{query:token+' — how much dry flour was used?',foodId:'atta',grams:''}];
 if(['chai','tea','cup chai','cup tea'].includes(clean))return [{query:token+' — milk grams (check fat % / label)',foodId:'milk',grams:''},{query:'Sugar in this chai (enter 0 for unsweetened)',foodId:'sugar',grams:''}];
 const f=nFoods().find(f=>f.aliases?.includes(clean)||f.name.toLowerCase()===clean);
 return [{query:token,foodId:f?.id||'',grams:f?grams:''}];
 });}
function nDraftHTML(){const d=readEntry(selected).mealDraft;if(!d)return `<form onsubmit="event.preventDefault();nStartDraft()"><label class="field">What did you eat?<textarea id="nPrompt" required maxlength="1000" placeholder="For example: 2 roti + dal + 1 cup chai"></textarea></label><label class="field space">Meal<select id="nSlot">${nOptions(['Breakfast','Lunch','Dinner','Snack & chai','Other'].map(x=>[x,x]),'Lunch')}</select></label><button class="primary space">Ask me the details →</button></form><p class="tiny">Separate foods with + or commas. Try “150 g cooked rice + 120 g chickpeas”. “Dal” is a recipe, so I will ask what went into it. Add paneer or a packaged food from its label.</p>`;
 return `<div class="topicbox"><div class="eyebrow">You said</div><p>${esc(d.prompt)}</p><p class="details"><b>My question:</b> Which exact ingredients or labels match your meal, and how many grams were used? Dry and cooked weights are different. For a shared pot, enter the whole batch and the share you ate below.</p></div><div class="grid two"><label class="field">Meal label<input maxlength="200" value="${esc(d.title)}" onchange="nDraftSet('title',this.value)"></label><label class="field">Meal<select onchange="nDraftSet('slot',this.value)">${nOptions(['Breakfast','Lunch','Dinner','Snack & chai','Other'].map(x=>[x,x]),d.slot)}</select></label></div>${d.items.map((it,i)=>`<div class="sub"><p class="details"><b>${i+1}.</b> ${esc(it.query)}${!it.foodId?' · I need an ingredient or label for this. No calories have been guessed.':''}</p><div class="grid two"><label class="field">Which food / preparation?<select onchange="nDraftItem(${i},'foodId',this.value)"><option value="">Choose a matching ingredient</option>${nOptions(nFoods().map(f=>[f.id,f.name]),it.foodId)}</select></label><label class="field">Grams in your portion or full batch<input type="number" min="0" max="10000" step="0.1" value="${esc(it.grams)}" onchange="nDraftItem(${i},'grams',this.value)" placeholder="Please weigh / estimate explicitly"></label></div><button class="small ghost" onclick="nDraftRemove(${i})">Remove ingredient</button></div>`).join('')}<div class="right space"><button class="small" onclick="nDraftAdd()">+ Ingredient</button><button class="small" onclick="nOpenLabel()">+ Food from a label</button></div><p class="tiny">For dal, sabzi, thepla, paneer curry or restaurant food: add every ingredient, or enter nutrition from a reliable recipe/label. Never substitute plain cooked lentils for a bowl of watery dal without its recipe. For ghee, use its label; the oil reference is canola oil.</p><div class="formgrid space">${nDraftNumber('oil','Additional cooking oil · grams',d.oil,0,500,.1)}${nDraftNumber('salt','Additional salt · grams',d.salt,0,50,.1)}${nDraftNumber('share','Share of these quantities eaten · %',d.share,1,100,.1)}</div><p class="tiny">Enter 0 if no additional oil/salt, or if already included in the ingredient rows or label. This prevents double counting. For one portion use 100%; for ¼ of a pot use 25%. Count milk, sugar, toppings and sauces. Water / plain brewed tea add negligible energy.</p><label class="checklabel"><input type="checkbox" ${d.reviewed?'checked':''} onchange="nDraftSet('reviewed',this.checked)"><span>I reviewed ingredients, preparation, quantity and my share. Any estimates are intentional.</span></label><div class="topicbox"><b>Preview · not saved as eaten yet</b><p class="details">${nDraftReady(d)?nMacros(nTotals(nDraftParts(d))):'Answer every portion question and match every ingredient to calculate this meal.'}</p></div><div class="right"><button class="primary" onclick="nSaveDraft()">${d.editId?'Save meal changes':'Add meal to my log'}</button><button class="small" onclick="nDiscardDraft()">Discard draft</button></div>`;
}
function nDraftNumber(k,label,v,min,max,step){return `<label class="field">${label}<input type="number" min="${min}" max="${max}" step="${step}" value="${esc(v)}" onchange="nDraftSet('${k}',this.value)"></label>`;}
function nStartDraft(){if(selected>todayDay())return;let text=document.getElementById('nPrompt').value.trim().slice(0,1000);if(!text)return;entry().mealDraft={prompt:text,title:text.slice(0,200),slot:document.getElementById('nSlot').value,items:nParse(text),oil:'',salt:'',share:100,reviewed:false};entry().foodComplete=false;save();render();}
function nDraftSet(k,v){if(selected>todayDay()||!entry().mealDraft)return;const limits={oil:[0,500],salt:[0,50],share:[1,100]};if(limits[k]&&v!==''&&!nInRange(v,...limits[k])){toast('Enter a quantity in the shown range.');render();return;}if(k==='title')v=String(v).slice(0,200);entry().mealDraft[k]=v;if(k!=='reviewed')entry().mealDraft.reviewed=false;save();render();}
function nDraftItem(i,k,v){if(selected>todayDay())return;const d=entry().mealDraft;if(!d?.items[i])return;if(k==='grams'&&v!==''&&!nInRange(v,0,10000)){toast('Enter grams between 0 and 10,000.');render();return;}if(k==='foodId'&&v&&!nFood(v))return;d.items[i][k]=v;d.reviewed=false;save();render();}
function nDraftAdd(){if(selected>todayDay())return;let d=entry().mealDraft;if(d.items.length>=30)return toast('Up to 30 ingredients per meal.');d.items.push({query:'Additional ingredient',foodId:'',grams:''});d.reviewed=false;save();render();}
function nDraftRemove(i){if(selected>todayDay())return;entry().mealDraft.items.splice(i,1);entry().mealDraft.reviewed=false;save();render();}
function nInRange(v,min,max){return v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max;}
function nDraftReady(d){return !!(d&&d.items.length&&d.items.every(i=>nFood(i.foodId)&&nInRange(i.grams,0,10000))&&nInRange(d.oil,0,500)&&nInRange(d.salt,0,50)&&nInRange(d.share,1,100)&&d.items.some(i=>Number(i.grams)>0));}
function nDraftParts(d){let s=Number(d.share)/100,parts=d.items.filter(i=>+i.grams>0).map(i=>nPart(i.foodId,+i.grams*s));if(+d.oil>0)parts.push(nPart('oil',+d.oil*s));if(+d.salt>0)parts.push(nPart('salt',+d.salt*s));return parts;}
function nSaveDraft(){if(selected>todayDay())return;let e=entry(),d=e.mealDraft;if(!nDraftReady(d)||!d.reviewed||!d.title.trim())return toast('Match each ingredient, answer every quantity question and review before saving.');const meal={id:d.editId||'meal'+Date.now()+Math.floor(Math.random()*1000),title:d.title.trim().slice(0,200),slot:d.slot,parts:nDraftParts(d),note:d.prompt.slice(0,1000),saved:todayISO()};if(!e.foodLog)e.foodLog=[];if(d.editId){let i=e.foodLog.findIndex(m=>m.id===d.editId);if(i<0)return toast('Meal no longer exists.');e.foodLog[i]=meal;}else e.foodLog.push(meal);delete e.mealDraft;e.foodComplete=false;nSnapshot();save();render();toast('Meal saved. Totals updated.');}
function nDiscardDraft(){if(!confirm('Discard this unfinished meal draft?'))return;delete entry().mealDraft;save();render();}
function nLogHTML(){const logs=readEntry(selected).foodLog||[];return logs.length?logs.map((m,i)=>`<div class="sub"><div class="cardhead"><div><span class="tag">${esc(m.slot)}</span><h3 class="space" style="margin-top:8px">${esc(m.title)}</h3><p class="details">${nMacros(nTotals(m.parts))}</p></div><div class="right"><button class="small" onclick="nEditMeal(${i})" ${selected>todayDay()?'disabled':''}>Edit</button><button class="small ghost" onclick="nDeleteMeal(${i})" ${selected>todayDay()?'disabled':''}>Remove</button></div></div><details><summary>Ingredients & weights</summary>${m.parts.map(p=>`<p class="tiny">${esc(p.name)} · ${nFmt(p.grams,1)} g · ≈ ${nFmt(p.nutrients.kcal*p.grams/100)} kcal</p>`).join('')}<p class="tiny">${esc(m.note||'')}</p></details></div>`).join(''):'<div class="empty">Your food log is ready for your first meal. A planned meal is never marked eaten automatically.</div>';}
function nEditMeal(i){if(selected>todayDay())return;if(entry().mealDraft&&!confirm('Replace your current unfinished draft?'))return;let m=entry().foodLog[i];entry().mealDraft={editId:m.id,title:m.title,prompt:m.note||m.title,slot:m.slot,items:m.parts.map(p=>({query:p.name,foodId:p.foodId,grams:p.grams})),oil:0,salt:0,share:100,reviewed:false};entry().foodComplete=false;save();render();}
function nDeleteMeal(i){if(selected>todayDay()||!confirm('Remove this meal from this day’s actual food log?'))return;entry().foodLog.splice(i,1);entry().foodComplete=false;save();render();}
function nComplete(on){if(selected>todayDay())return;if(on&&(!entry().foodLog?.length||entry().mealDraft)){toast('Log your meals and finish or discard the open draft first.');render();return;}entry().foodComplete=on;if(on)nSnapshot();save();render();}
function nOpenLabel(){document.getElementById('modalRoot').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Add nutrition label"><h2>A food from its label</h2><p class="details">Enter values per 100 g. For a recipe, divide batch totals by its final cooked weight and multiply by 100. Use a reliable source; unknown values stay blank.</p><form onsubmit="event.preventDefault();nSaveLabel()"><label class="field">Food name & preparation<input id="nlName" maxlength="120" required placeholder="My paneer · brand / fat level"></label><div class="formgrid space">${NKEYS.map(k=>nNum('nl_'+k,k==='kcal'?'Energy · kcal':k+' · '+(['sodium','calcium','iron'].includes(k)?'mg':'g'),'',0,k==='kcal'?1000:['sodium','calcium','iron'].includes(k)?100000:100,.1).replace(['kcal','protein','carbs','fat'].includes(k)?'__never__':' required','')).join('')}</div><p class="tiny">Required: calories, protein, carbs and fat. Leave fiber and micronutrients blank if the label does not give them. Fiber cannot exceed total carbohydrate in this app’s total-carbohydrate convention.</p><div class="right space"><button class="primary">Save label reference</button><button type="button" class="small" onclick="closeModal()">Cancel</button></div></form></div></div>`;document.getElementById('nlName').focus();}
function nSaveLabel(){let name=document.getElementById('nlName').value.trim(),n={};if(!name)return;for(const k of NKEYS){let raw=document.getElementById('nl_'+k).value;n[k]=raw===''?null:Number(raw);}try{nValidateValues(n,true);}catch(e){toast(e.message);return;}if(S.nutrition.custom.length>=500)return toast('Custom food limit reached.');let f={id:'custom'+Date.now()+Math.floor(Math.random()*1000),name:name.slice(0,120),aliases:[],tags:[],nutrients:n,source:'User-entered label',reference:'User-entered label; verify against your package'};S.nutrition.custom.push(f);let d=view==='mealplan'?null:entry().mealDraft;if(d){let blank=d.items.find(i=>!i.foodId);if(blank)blank.foodId=f.id;else d.items.push({query:name,foodId:f.id,grams:''});d.reviewed=false;}save();closeModal();render();toast(view==='mealplan'?'Food label saved. Choose it under Add an ingredient.':'Food saved. Enter the grams you ate in your meal draft.');}
function nAllowed(r){return !r.parts.some(([id])=>nFood(id).tags.some(t=>S.nutrition.profile.avoid.includes(t)));}
function nRecipeMeal(r,scale=1){return {recipeId:r.id,slot:r.slot,name:r.name,prep:r.prep,parts:r.parts.map(([id,g])=>nPart(id,Math.round(g*scale*10)/10))};}
function nShopping(plan){let map=new Map();for(const m of plan)for(const p of m.parts){if(!map.has(p.foodId))map.set(p.foodId,{name:p.name,grams:0});map.get(p.foodId).grams+=p.grams;}return [...map.values()];}
function nSwapMeal(i,id){let r=NRECIPES.find(r=>r.id===id);if(!r||!nAllowed(r)||r.slot!==entry().mealPlan[i].slot)return;let old=entry().mealPlan[i],target=nTotals(old.parts).kcal,base=nTotals(nRecipeMeal(r).parts).kcal;entry().mealPlan[i]=nRecipeMeal(r,clamp(target/base,.75,1.5));save();render();}
function nPlanGrams(i,j,v){if(!nInRange(v,0,3000)){toast('Enter grams between 0 and 3,000.');render();return;}entry().mealPlan[i].parts[j].grams=+v;save();render();}
function nPlanToDraft(i){if(selected>todayDay())return;if(entry().mealDraft&&!confirm('Replace your unfinished meal draft with this planned meal?'))return;let m=entry().mealPlan[i];entry().mealDraft={title:m.name,prompt:'Planned meal: '+m.name+'. Confirm actual quantities; adjust for any substitutions.',slot:m.slot,items:m.parts.map(p=>({query:p.name,foodId:p.foodId,grams:p.grams})),oil:0,salt:'',share:100,reviewed:false};entry().foodComplete=false;save();render();toast('Review the actual ingredients, portion and salt, then save as eaten.');}
function nValidateValues(n,optional=false){if(!n||typeof n!=='object')throw Error('Invalid nutrient values.');for(const k of NKEYS){if(n[k]==null&&optional&&!['kcal','protein','carbs','fat'].includes(k))continue;let max=k==='kcal'?1000:['sodium','calcium','iron'].includes(k)?100000:100;if(n[k]==null&& !['kcal','protein','carbs','fat'].includes(k))continue;if(typeof n[k]!=='number'||!Number.isFinite(n[k])||n[k]<0||n[k]>max)throw Error('Check '+k+' per 100 g.');}if(n.fiber!=null&&n.fiber>n.carbs+.1)throw Error('Fiber cannot exceed total carbohydrate.');if(n.sugar!=null&&n.sugar>n.carbs+.5)throw Error('Sugar cannot exceed total carbohydrate.');if(n.protein+n.carbs+n.fat>105)throw Error('Macronutrient grams exceed 100 g; check the label basis.');}
function nValidateProfile(p){if(!p||typeof p!=='object')throw Error('Missing nutrition profile.');for(const [k,lo,hi] of [['age',18,100],['height',120,230],['weight',35,250]])if(typeof p[k]!=='number'||!nInRange(p[k],lo,hi))throw Error('Check your '+k+'.');if(!['','female','male'].includes(p.sex)||!['','1.2','1.375','1.55','1.725'].includes(String(p.activity))||![0,250,300,500].includes(p.deficit)||![1,1.2,1.4,1.6].includes(p.proteinFactor)||!['','standard','supported'].includes(p.scope)||typeof p.confirmed!=='boolean'||!Array.isArray(p.avoid)||p.avoid.some(x=>!['dairy','soy','peanut','wheat'].includes(x))||typeof p.note!=='string'||p.note.length>400)throw Error('Invalid nutrition setup.');if(p.confirmed&&(!p.sex||!p.activity||!p.scope))throw Error('Choose equation, activity and nutrition needs.');}
function nValidateState(st,x){st.nutrition=x.nutrition||emptyNutrition();nValidateProfile(st.nutrition.profile);const foods=st.nutrition.custom;if(!Array.isArray(foods)||foods.length>500)throw Error('Invalid custom foods.');for(const f of foods){if(!/^custom\d+$/.test(f.id)||typeof f.name!=='string'||f.name.length>120||!Array.isArray(f.tags)||!Array.isArray(f.aliases)||f.source!=='User-entered label')throw Error('Invalid label food.');nValidateValues(f.nutrients,true);}const ids=new Set([...DATA.nutritionFoods,...foods].map(f=>f.id));const validParts=parts=>{if(!Array.isArray(parts)||parts.length>40)throw Error('Invalid meal ingredients.');for(const p of parts){if(!p||!ids.has(p.foodId)||typeof p.name!=='string'||typeof p.grams!=='number'||!nInRange(p.grams,0,10000)||typeof p.source!=='string')throw Error('Invalid ingredient.');nValidateValues(p.nutrients,true);}};
for(const e of Object.values(st.entries)){if(e.foodComplete!==undefined&&typeof e.foodComplete!=='boolean')throw Error('Invalid food day.');if(e.foodLog!==undefined){if(!Array.isArray(e.foodLog)||e.foodLog.length>200)throw Error('Invalid food log.');for(const m of e.foodLog){if(!/^meal\d+$/.test(m.id)||typeof m.title!=='string'||typeof m.slot!=='string'||typeof m.note!=='string')throw Error('Invalid meal.');validParts(m.parts);}}if(e.mealPlan!==undefined){if(!Array.isArray(e.mealPlan)||e.mealPlan.length>10)throw Error('Invalid meal plan.');for(const m of e.mealPlan){if((m.recipeId!=='custom'&&!NRECIPES.some(r=>r.id===m.recipeId))||typeof m.name!=='string'||typeof m.slot!=='string'||typeof m.prep!=='string')throw Error('Invalid recipe.');validParts(m.parts);}}if(e.nutritionTarget){let t=e.nutritionTarget;for(const k of ['bmr','tdee','target','deficit','protein','carbs','fat','fiber','weight'])if(typeof t[k]!=='number'||!Number.isFinite(t[k])||t[k]<0||t[k]>20000)throw Error('Invalid nutrition target.');if(!validDate(t.created)||Math.abs(t.tdee-t.target-t.deficit)>.1)throw Error('Invalid target snapshot.');}if(e.mealDraft){let d=e.mealDraft;if(typeof d.title!=='string'||typeof d.prompt!=='string'||typeof d.slot!=='string'||typeof d.reviewed!=='boolean'||!Array.isArray(d.items)||d.items.length>30||d.items.some(i=>!i||typeof i.query!=='string'||i.foodId!==''&&!ids.has(i.foodId)||i.grams!==''&&!nInRange(i.grams,0,10000))||d.editId&&!/^meal\d+$/.test(d.editId))throw Error('Invalid meal draft.');for(const [k,min,max] of [['oil',0,500],['salt',0,50],['share',1,100]])if(d[k]!==''&&!nInRange(d[k],min,max))throw Error('Invalid draft quantity.');}if(e.foodComplete&&(!e.foodLog?.length||e.mealDraft))throw Error('Incomplete food log marked complete.');}return st;}

function nWeekSummaryHTML(){const days=nWeekDays(),planned=days.filter(d=>readEntry(d).mealPlan?.length),meals=planned.flatMap(d=>readEntry(d).mealPlan),t=nTotals(meals.flatMap(m=>m.parts));return `<b>${planned.length}/${days.length} days with menus · ${nMacros(t)}</b><p class="tiny">These are planned week totals, not eaten food. ${planned.length?`Average across ${planned.length} planned days: ${nFmt(t.kcal/planned.length)} kcal.`:''} Empty meals contribute no estimate; finish their ingredients before using the total.</p>`;}

function nWeeklyView(){const days=nWeekDays();return `<div class="titleline"><div><div class="eyebrow">Your editable menu notebook</div><h1>A week of meals, your way.</h1><p class="muted">Change any date, any meal, any ingredient. Future menus are open now.</p></div>${dayNav()}</div><div class="card peach"><div class="cardhead"><h2>Week ${Math.floor((selected-1)/7)+1} · ${pretty(dateFor(days[0]))}–${pretty(dateFor(days.at(-1)))}</h2><div class="right"><button class="small" onclick="go('mealplan',${Math.max(1,days[0]-7)})" ${days[0]===1?'disabled':''}>← Previous week</button><button class="small" onclick="go('mealplan',${Math.min(91,days[0]+7)})" ${days.at(-1)===91?'disabled':''}>Next week →</button></div></div><div class="right"><button class="small" onclick="nFillWeek()">Suggest menus for unplanned days</button><button class="small" onclick="nCopyDayToWeek()" ${!readEntry(selected).mealPlan?.length?'disabled':''}>Repeat selected day across this week</button><button class="small ghost" onclick="go('nutrition',${selected})">Calorie setup & actual food log ↗</button></div><div id="menuWeekSummary" class="topicbox">${nWeekSummaryHTML()}</div></div><div id="menuWeekCards" class="grid three space">${nWeekCardsHTML()}</div><div class="card space" id="menuDayEditor"><div class="cardhead"><div><div class="eyebrow">Editing ${fullDate(selected)}</div><h2>Day ${selected} · my menu</h2></div><div class="right"><button class="small" onclick="nGeneratePlan()">Suggest / replace this day</button><button class="small" onclick="nBlankDay()">Build my own day</button></div></div><p class="details">Rename a meal, replace ingredients, change grams, or add another meal. Calories and macros update while you edit. Names alone do not calculate nutrition: add the ingredients or a matching food label.</p>${nPlanHTML()}<div class="right space"><button class="small primary" onclick="nAddPlanMeal()">+ Add a meal</button><label class="field">Copy this entire menu to<input id="menuCopyDay" type="date" min="${dateFor(1)}" max="${dateFor(91)}" value="${dateFor(Math.min(selected+1,91))}"></label><button class="small" onclick="nCopyDay()" ${!readEntry(selected).mealPlan?.length?'disabled':''}>Copy day’s menu</button></div></div><details class="card space"><summary>Weekly ingredient / prep list</summary><p class="tiny">The list combines all planned meals in this week. Cooked quantities are prep weights; they are not dry shopping weights. Check ingredients against your preferences and allergies.</p><div id="menuWeekShopping">${nWeekShoppingHTML()}</div></details><p class="footnote">Menu changes autosave and are included in your JSON backup. They never change your actual food intake, completed days or rewards.</p>`;}

Choose food…</option>${nOptions(nFoods().map(f=>[f.id,f.name]),'')}</select></label><div class="right space"><label class="field" style="flex:1">Grams<input id="menuAddGrams${i}" type="number" min="0.1" max="3000" step="0.1" value="100"></label><button class="small" onclick="nAddPlanPart(${i})">+ Add</button></div><button class="small ghost" onclick="nOpenLabel()">Add an unfamiliar food from its label</button></div><p class="tiny">Use the preparation shown: dry flour for roti/thepla, cooked rice for rice portions. Include oil, milk, sugar and sauces. Every row is the quantity in your planned serving.</p><div class="right"><button class="small" onclick="nCopyOneMeal(${i})">Copy meal to another date</button><button class="small ghost danger" onclick="nRemovePlanMeal(${i})">Remove meal</button>${selected<=todayDay()?`<button class="small" onclick="nMenuToActual(${i})">Log as eaten →</button>`:''}</div></div>`).join('')}</div>`;}
function nMenuLive(){const write=(id,html)=>{let el=document.getElementById(id);if(el)el.innerHTML=html;};const plan=readEntry(selected).mealPlan||[];write('menuDayTotals',nPlanTotalHTML(plan));plan.forEach((m,i)=>write('menuMealTotals'+i,nMacros(nTotals(m.parts))+(!m.parts.some(p=>p.grams>0)?' · add ingredients to calculate this meal':'')));if(view==='mealplan'){write('menuWeekSummary',nWeekSummaryHTML());write('menuWeekCards',nWeekCardsHTML());write('menuWeekShopping',nWeekShoppingHTML());}}
function nMenuText(i,k,v){if(!['slot','name','prep'].includes(k)||!entry().mealPlan?.[i])return;if(k==='slot'&&!['Breakfast','Lunch','Dinner','Snack & chai','Other'].includes(v))return;entry().mealPlan[i][k]=String(v).slice(0,k==='prep'?1000:200);save();nMenuLive();}

function nReplaceMenuMeal(i,id){let r=NRECIPES.find(r=>r.id===id);if(!r||!nAllowed(r))return;const slot=entry().mealPlan[i].slot;entry().mealPlan[i]={...nRecipeMeal(r),slot};save();render();}
function nMakeDayPlan(day){const plan=[];for(const slot of ['Breakfast','Lunch','Dinner','Snack & chai']){const choices=NRECIPES.filter(r=>r.slot===slot&&nAllowed(r));if(!choices.length)return null;plan.push(nRecipeMeal(choices[(day-1)%choices.length]));}const t=nTarget(day),base=nTotals(plan.flatMap(m=>m.parts)).kcal,scale=t?clamp(t.target/base,.75,1.5):1;return plan.map(m=>nRecipeMeal(NRECIPES.find(r=>r.id===m.recipeId),scale));}

function score(d){if(d>todayDay())return 0;let m=missions(d);return Math.round(m.filter(x=>x.done).length/m.length*100);}
function qualifies(d){return d<=todayDay()&&score(d)>=S.settings.rewardThreshold;}
function eligible(i){let b=bounds(i);if(todayDay()<b.last)return false;for(let d=1;d<=b.last;d++)if(!qualifies(d))return false;return true;}
function levelStats(i){let b=bounds(i),passed=0,points=0;for(let d=b.first;d<=b.last;d++){passed+=qualifies(d)?1:0;points+=score(d);}return{passed,percent:Math.round(points/DATA.levels[i].days),...b};}
function allStats(){let elapsed=clamp(todayDay(),0,91),xp=0,perfect=0,steps=0,vid=0,gita=0;for(let d=1;d<=elapsed;d++){xp+=missions(d).filter(x=>x.done).length*10;perfect+=score(d)===100?1:0;let e=readEntry(d);steps+=num(e.steps);vid+=e.video&&e.posted?1:0;gita+=num(e.gita);}let mastered=Object.values(S.problems).filter(p=>p.status==='Mastered').length;let solved=Object.values(S.problems).filter(p=>['Solved','Mastered'].includes(p.status)).length;return{elapsed,xp,perfect,steps,vid,gita,mastered,solved};}
function streak(){let d=Math.min(91,todayDay());if(d<1)return 0;if(!qualifies(d))d--;let n=0;while(d>0&&qualifies(d)){n++;d--;}return n;}
function latestWeight(){let keys=Object.keys(S.entries).map(Number).filter(d=>d<=todayDay()&&num(S.entries[d].weight)>0).sort((a,b)=>b-a);return keys.length?num(S.entries[keys[0]].weight):S.settings.startWeight;}

function journeyView(){return `<div class="titleline"><div><div class="eyebrow">Seven chapters · one promise</div><h1>Good things are earned, gently.</h1><p class="muted">${pretty(dateFor(1),true)} → ${pretty(dateFor(91),true)} · 90 days of practice + a Day 91 finale.</p></div><span class="sticker">a little joy at every level ♡</span></div><div class="notice info">Your requested levels total 91 days: 7 + 7 + 7 + 14 + 14 + 14 + 28. Rewards unlock after the final date of a level and when every day up to that point meets your ${S.settings.rewardThreshold}% completion rule. Default: all core missions. A difficult day keeps its progress; you can revisit missed work or explicitly adjust the rule in Settings. Weight and salary outcomes never gate rewards.</div><div class="road">${DATA.levels.map((l,i)=>{let b=levelStats(i),ok=eligible(i),claimed=S.claims[i],current=levelFor(clamp(todayDay(),1,91))===i;return `<div class="card level ${current?'current':''} ${!ok&&!current?'locked':''}"><div class="levelicon" style="background:${['#f5e8a9','#f9dfcf','#e9e0f4','#deeee3'][i%4]}">${l.icon}</div><div><div class="eyebrow">LEVEL ${i+1} · ${l.days} DAYS · ${pretty(dateFor(b.first))}–${pretty(dateFor(b.last),true)}</div><h2 style="margin-top:5px">${l.name}</h2><div class="reward">${esc(l.reward)}</div>${progressBar(b.percent)}<div class="tiny">${b.passed}/${l.days} qualifying days · ${b.percent}% of this level’s core missions complete</div></div><div><span class="pill">${claimed?'✓ Celebrated':ok?'✦ Ready to celebrate':current?'↗ In progress':'◌ Still ahead'}</span><p class="tiny">${claimed?'Claimed '+pretty(claimed.date,true):ok?'You followed through. Enjoy this.':`Day ${b.first}–${b.last} · unlock at level completion`}</p><button class="small ${ok&&!claimed?'primary':''}" onclick="claimReward(${i})" ${!ok||claimed?'disabled':''}>${claimed?'Reward claimed':'Claim my reward'}</button><button class="small ghost" onclick="go('daily',${b.first})">View days →</button></div></div>`;}).join('')}</div><div class="card peach space"><h2>What Day 91 actually means</h2><p>Compare your starting and current weight trend, strength and energy; explain unfamiliar DSA problems; present your project; compare your first and final speaking clips; review actual interviews and offers.</p><p class="details">A 15–20 LPA hybrid role and 60 kg are aspirations, not guaranteed by a deadline. Your finale should show evidence of growth and a realistic next chapter.</p><button class="small" onclick="go('progress')">Open my evidence dashboard ↗</button></div>`;}
function claimReward(i){if(!eligible(i)||S.claims[i])return;S.claims[i]={date:todayISO(),rule:S.settings.rewardThreshold};save();render();celebrate('Level '+(i+1)+' complete!',DATA.levels[i].reward+' — a little celebration of the promises you kept.');}
function celebrate(title,msg){document.getElementById('modalRoot').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="badgeflower">✦</div><div style="text-align:center"><span class="eyebrow">THIS MOMENT IS YOURS</span><h1>${esc(title)}</h1><p>${esc(msg)}</p><button class="primary" onclick="closeModal()">I’m proud of me ♡</button></div></div></div>`;document.querySelector('#modalRoot button').focus();if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<32;i++){let el=document.createElement('i');el.className='confetti';el.style.left=Math.random()*100+'%';el.style.background=['#c5d995','#e5bdac','#d7c8e8','#f3d878'][i%4];el.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

function dailyDsaFoundations(ids,day){
 const groups=[...new Set(ids.map(id=>DATA.problems[id-1].group))];
 if(!ids.length)return `<div class="topicbox"><h4>${day===91?'Final Striver recall':'Revision-first day'}</h4><p class="details">Choose previously attempted problems from this exact sheet. Explain the underlying concept, re-solve without hints, and write one mistake you now avoid. No new external problems are added.</p></div>`;
 return groups.map(g=>`<div class="topicbox"><h4>Learn first · ${esc(g)}</h4><p class="details">${esc(DATA.dsaFoundations[g])}</p></div>`).join('');
}
function dsaLessonHTML(p,interactive){
 const q=S.problems[p.id]||{},learn=q.learning||{};
 const labels={concept:'I understand the core concept and its invariant',dryrun:'I completed the dry run on paper',explain:'I can explain the approach, complexity and one edge case'};
 return `<details class="sub" ${interactive?'open':''}><summary><span class="muted">#${p.id}</span> ${esc(p.title)}</summary><p class="tiny">${esc(p.group)} → ${esc(p.pattern)} · ${p.difficulty} · ${esc(q.status||'Not started')}</p><div class="topicbox"><h4>Core concept to learn</h4><p class="details">${esc(p.concept)}</p><h4>Dry run before coding</h4><p class="details">${esc(p.drill)}</p></div>${interactive?Object.entries(labels).map(([k,t])=>`<label class="checklabel"><input type="checkbox" ${learn[k]?'checked':''} ${selected>todayDay()?'disabled':''} onchange="setDsaLearning(${p.id},'${k}',this.checked)"><span>${t}</span></label>`).join(''):''}<p class="tiny">Start with a brute-force approach, then derive the improvement. Use the exact title in the linked Striver sheet; add its direct URL in the practice note if you want.</p>${interactive?`<button class="small" onclick="openProblem(${p.id})">Practice notes & reschedule ↗</button>`:''}</details>`;
}
function setDsaLearning(id,k,on){if(selected>todayDay()||!['concept','dryrun','explain'].includes(k))return;if(!S.problems[id])S.problems[id]={};if(!S.problems[id].learning)S.problems[id].learning={};S.problems[id].learning[k]=!!on;save();}
function migrateDsa(st){
 if(st.dsaCatalog===DATA.dsaCatalog)return st;
 if(st.dsaCatalog)throw Error('Unsupported DSA catalogue.');
 const next={},archive={...(st.legacyDsa||{})};
 for(const [id,record] of Object.entries(st.problems)){
  archive['custom-'+id]={title:DATA.legacyDsaTitles[id]||'Previous practice '+id,record};
  const target=DATA.legacyDsaMap[id];
  if(target){
   if(!next[target])next[target]={...record};
   else {const previous=next[target],rank={'Not started':0,'Attempted':1,'Solved':2,'Mastered':3};const stronger=(rank[record.status]||0)>(rank[previous.status]||0)?record:previous;const notes=[previous.note,record.note].filter(Boolean);next[target]={...stronger,...(notes.length?{note:[...new Set(notes)].join('\n\n')}: {})};}
  }
 }
 st.problems=next;st.legacyDsa=archive;st.dsaCatalog=DATA.dsaCatalog;
 return st;
}
function exportLegacyDsa(){downloadBlob(new Blob([JSON.stringify(S.legacyDsa||{},null,2)],{type:'application/json'}),'GlowQuest-previous-DSA-records.json');}

function problemDue(p){return num((S.problems[p.id]||{}).day)||Math.ceil(p.id/2);}
function revisionDue(p){const q=S.problems[p.id]||{};return q.status==='Solved'&&q.reviewDue&&q.reviewDue<=todayISO();}
function studyView(){let st=allStats(),cats=['All','Due today','Review due','Not started','Attempted','Solved','Mastered',...new Set(DATA.problems.map(p=>p.group))];let list=DATA.problems.filter(p=>{let q=S.problems[p.id]||{},status=q.status||'Not started';return(studyFilter==='All'||studyFilter==='Due today'&&problemDue(p)<=clamp(todayDay(),1,91)&&!['Solved','Mastered'].includes(status)||studyFilter==='Review due'&&revisionDue(p)||studyFilter===status||studyFilter===p.group)&&(!studySearch||p.title.toLowerCase().includes(studySearch.toLowerCase()));});let total=list.length;studyPage=clamp(studyPage,0,Math.max(0,Math.ceil(total/20)-1));list=list.slice(studyPage*20,studyPage*20+20);return `<div class="titleline"><div><div class="eyebrow">Understand · attempt · explain · revisit</div><h1>Learn it so it stays.</h1><p class="muted">Your exact Striver list: ${DATA.problems.length} problems. Learn the concept before solving.</p></div><a href="https://takeuforward.org/prep-hub/strivers-180-master-dsa-patterns?page=sheet" target="_blank" rel="noopener">Open Striver’s official sheet ↗</a></div><div class="grid three"><div class="card mint"><div class="goalvalue">${st.solved}<small> / ${DATA.problems.length} solved</small></div><div class="tiny">A working solution with understood reasoning.</div>${progressBar(st.solved/DATA.problems.length*100)}</div><div class="card lilac"><div class="goalvalue">${st.mastered}<small> independently re-solved</small></div><div class="tiny">Mark mastered after a no-hint recall attempt.</div>${progressBar(st.mastered/DATA.problems.length*100)}</div><div class="card peach"><div class="goalvalue">${DATA.problems.filter(revisionDue).length}<small> reviews due</small></div><div class="tiny">After solving: spaced reviews at +1, +3 and +7 days.</div><button class="small space" onclick="setFilter('Review due')">Open review queue</button></div></div><div class="notice info">This is exactly the 179-problem list you supplied from the current Striver’s 180 sheet, in the same topic and pattern order. No extra problems are added. Days 1–89 contain two scheduled problems each; Day 90 contains the final problem plus revision; Day 91 is your final recall session. Every problem has a matching core-concept lesson and dry run. Rescheduling a problem also moves its lesson. Two problems is a stretch target; thoughtful learning and revision still come first.</div>${Object.keys(S.legacyDsa||{}).length?'<p class="tiny">Previous DSA records are preserved. Matching problems retain their status and notes; unmatched history is excluded from this sheet. <button class="small" onclick="exportLegacyDsa()">Download previous DSA records</button></p>':''}<div class="card"><div class="right"><input type="search" aria-label="Search practices" placeholder="Find a problem…" value="${esc(studySearch)}" oninput="studySearch=this.value;studyPage=0;refreshProblemList()" id="problemSearch" style="flex:1;min-width:180px"><select aria-label="Filter practices" onchange="setFilter(this.value)" style="width:230px">${cats.map(c=>`<option ${studyFilter===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="problemList">${problemListHTML(list,total)}</div></div><div class="card space"><h2>The weekly recall ritual</h2><div class="grid three"><div><h4>1. Choose evidence</h4><p class="details">Pick one independently solved problem, one mistake and one concept you can explain with an example.</p></div><div><h4>2. Re-solve before rereading</h4><p class="details">Start from a blank editor. Say the invariant, test edge cases and explain time and space cost.</p></div><div><h4>3. Adjust the next week</h4><p class="details">Move unfinished practice dates; keep the original attempt history. Remove extra volume before removing sleep.</p></div></div></div>`;}
function problemListHTML(list,total){return list.map(p=>{let q=S.problems[p.id]||{};return `<div class="problemrow"><span class="problemnum">${p.id}</span><div><button class="ghost small" style="padding:0;text-align:left" onclick="openProblem(${p.id})">${p.title} ↗</button><small>${p.group} / ${p.pattern} · ${p.difficulty} · Day ${problemDue(p)} ${q.reviewDue?'· review '+pretty(q.reviewDue):''}</small></div><select aria-label="Status for ${p.title}" onchange="setProblemStatus(${p.id},this.value)">${['Not started','Attempted','Solved','Mastered'].map(x=>`<option ${x===(q.status||'Not started')?'selected':''}>${x}</option>`).join('')}</select></div>`;}).join('')+(total===0?'<div class="empty">No matching practices. Try another filter.</div>':'')+`<div class="right space"><button class="small" onclick="studyPage--;render()" ${studyPage===0?'disabled':''}>← Previous</button><span class="tiny">${total} matches · page ${studyPage+1} of ${Math.max(1,Math.ceil(total/20))}</span><button class="small" onclick="studyPage++;render()" ${(studyPage+1)*20>=total?'disabled':''}>Next →</button></div>`;}
function refreshProblemList(){let input=document.getElementById('problemSearch'),pos=input.selectionStart;render();let next=document.getElementById('problemSearch');next.focus();next.setSelectionRange(pos,pos);}
function setFilter(f){studyFilter=f;studyPage=0;render();}
function plusDate(s,n){return new Date(utc(s)+n*86400000).toISOString().slice(0,10);}
function setProblemStatus(id,statusValue){if(!S.problems[id])S.problems[id]={};let q=S.problems[id];q.status=statusValue;q.changed=todayISO();if(statusValue==='Solved'){q.solvedDate=todayISO();q.reviews=0;q.reviewDue=plusDate(todayISO(),1);}else if(statusValue!=='Attempted'){delete q.reviewDue;}save();render();}
function openProblem(id){let p=DATA.problems[id-1],q=S.problems[id]||{};document.getElementById('modalRoot').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Practice notes"><div class="cardhead"><span class="eyebrow">PRACTICE ${id} · ${p.group}</span><button class="small ghost" onclick="closeModal()">✕</button></div><h2>${p.title}</h2>${dsaLessonHTML(p,false)}<p class="details">Attempt → brute force → improve → explain correctness → test → record complexity.</p><label class="field">Schedule on challenge day<input id="problemDay" type="number" min="1" max="91" value="${problemDue(p)}"></label><label class="field space">Exact problem / solution URL (optional)<input id="problemUrl" type="url" value="${esc(q.url||'')}" placeholder="https://…"></label><label class="field space">Reasoning, complexity and mistakes<textarea id="problemNote">${esc(q.note||'')}</textarea></label><div class="right space"><button class="primary" onclick="saveProblem(${id})">Save practice note</button>${q.status==='Solved'?`<button class="small" onclick="reviewProblem(${id})">No-hint review done (${num(q.reviews)}/3)</button>`:''}</div><p class="tiny">Rescheduling changes the planned day, not your completion history. Only mark mastery when you can solve and explain without hints.</p></div></div>`;document.getElementById('problemDay').focus();}
function saveProblem(id){let d=Number(document.getElementById('problemDay').value),url=document.getElementById('problemUrl').value.trim();if(!Number.isInteger(d)||d<1||d>91){toast('Choose a day between 1 and 91.');return;}if(url&&!isHttp(url)){toast('Use a full https:// or http:// link.');return;}S.problems[id]={...(S.problems[id]||{}),day:d,url,note:document.getElementById('problemNote').value};save();closeModal();render();toast('Practice plan saved.');}
function reviewProblem(id){let q=S.problems[id];if(q.reviewDue&&q.reviewDue>todayISO()){toast('Your next spaced review is on '+pretty(q.reviewDue)+'. You can still practise without marking a scheduled review.');return;}if(q.lastReviewed===todayISO()){toast('Already reviewed today. Give recall time to work.');return;}q.reviews=Math.min(3,num(q.reviews)+1);q.lastReviewed=todayISO();if(q.reviews>=3){q.status='Mastered';delete q.reviewDue;}else q.reviewDue=plusDate(todayISO(),q.reviews===1?2:4);save();closeModal();render();toast(q.status==='Mastered'?'Mastered through three spaced re-solves.':'Review logged. Your next recall date is scheduled.');}
function weightChart(){let data=Object.keys(S.entries).map(Number).filter(d=>d<=todayDay()&&num(readEntry(d).weight)>0).sort((a,b)=>a-b).map(d=>({d,w:num(readEntry(d).weight)}));if(!data.length)return '<div class="empty">Log your first weight in Daily studio.<br>One measurement a week is enough to start a trend.</div>';let all=[{d:1,w:S.settings.startWeight},...data],min=Math.min(...all.map(x=>x.w))-1,max=Math.max(...all.map(x=>x.w))+1,end=Math.max(7,all[all.length-1].d),x=d=>45+(d-1)/(end-1)*500,y=w=>155-(w-min)/(max-min)*125;return `<svg class="chart" viewBox="0 0 580 190" role="img" aria-label="Weight trend in kilograms, from ${all[0].w} to ${all[all.length-1].w}">${[0,.5,1].map(f=>{let yy=155-f*125;return `<line x1="45" x2="555" y1="${yy}" y2="${yy}" stroke="#e1e5d8"/><text x="4" y="${yy+4}">${(min+f*(max-min)).toFixed(1)}</text>`;}).join('')}<polyline points="${all.map(t=>x(t.d)+','+y(t.w)).join(' ')}" fill="none" stroke="#4b7050" stroke-width="3"/>${all.map(t=>`<circle cx="${x(t.d)}" cy="${y(t.w)}" r="4" fill="#4b7050"><title>Day ${t.d}: ${t.w} kg</title></circle>`).join('')}<text x="45" y="180">Day 1</text><text x="510" y="180">Day ${end}</text></svg>`;}
function progressView(){let st=allStats(),entries=Object.keys(S.entries).map(Number).filter(d=>d<=todayDay()),avg=(key)=>{let a=entries.map(d=>num(readEntry(d)[key])).filter(n=>n>0);return a.length?(a.reduce((s,n)=>s+n,0)/a.length).toFixed(1):'—';},strength=entries.filter(d=>readEntry(d).strength).length,tech=entries.filter(d=>missions(d).find(m=>m.id==='tech').done).length;return `<div class="titleline"><div><div class="eyebrow">Real evidence · no invented results</div><h1>Look how far you’re coming.</h1><p class="muted">The numbers tell part of the story. Your notes and videos tell the rest.</p></div><button onclick="window.print()">Print my progress ↗</button></div><div class="grid three"><div class="card mint"><span class="eyebrow">Body & energy</span><div class="goalvalue">${(S.settings.startWeight-latestWeight()).toFixed(1)} <small>kg change</small></div><p class="details">${st.steps.toLocaleString('en-IN')} steps logged · ${strength} strength sessions<br>Average energy ${avg('energy')}/5 · sleep ${avg('sleep')} h</p></div><div class="card peach"><span class="eyebrow">Career readiness</span><div class="goalvalue">${st.mastered}<small> no-hint mastery</small></div><p class="details">${st.solved} practices solved · ${tech} tech explorations<br>${S.jobs.filter(j=>j.status==='Interview').length} interview-stage roles · ${S.jobs.filter(j=>j.status==='Offer').length} offers logged</p></div><div class="card lilac"><span class="eyebrow">Speaking confidence</span><div class="goalvalue">${st.vid}<small> clips posted</small></div><p class="details">Average clarity ${avg('clarity')}/5<br>Average confidence ${avg('confidence')}/5 · self-rated</p></div></div><div class="grid two space"><div class="card"><div class="cardhead"><h2>My weight trend</h2><span class="tiny">kg · logged measurements</span></div>${weightChart()}<p class="tiny">Baseline ${S.settings.startWeight} kg. Longer-term aspiration ${S.settings.targetWeight} kg. Use consistent weighing conditions; daily fluctuations are normal. There is no forced 60 kg line on Day 91.</p></div><div class="card"><h2>Consistency, week by week</h2><div class="bars">${Array.from({length:13},(_,i)=>{let start=i*7+1,end=Math.min(91,start+6,todayDay()),n=Math.max(0,end-start+1),s=0;for(let d=start;d<=end;d++)s+=score(d);let pct=n?Math.round(s/n):0;return `<div class="barcol"><div class="tiny">${n?pct+'%':'—'}</div><div class="bar" style="height:${pct}px" title="Week ${i+1}: ${pct}% average over ${n} elapsed days"></div><small>W${i+1}</small></div>`;}).join('')}</div><p class="tiny">Average daily core completion over elapsed days. Unlogged elapsed days count as zero; future days are excluded.</p></div></div><div class="card space"><div class="cardhead"><h2>Your job pipeline</h2><button class="small" onclick="addJob()">+ Add a role</button></div><p class="details">Track genuine opportunities, confirm hybrid expectations and record the next action. Salary is a target, not a promised outcome.</p><div class="tiny">Company · Role / next action · CTC (LPA) · Stage</div>${S.jobs.length?S.jobs.map((j,i)=>`<div class="jobrow"><input aria-label="Company ${i+1}" value="${esc(j.company)}" placeholder="Company" onchange="updateJob(${i},'company',this.value)"><input aria-label="Role and next action ${i+1}" value="${esc(j.role)}" placeholder="Role · follow-up date · hybrid?" onchange="updateJob(${i},'role',this.value)"><input type="number" min="0" max="500" step="0.1" aria-label="Salary in LPA ${i+1}" value="${esc(j.salary||'')}" placeholder="LPA" onchange="updateJob(${i},'salary',this.value)"><select aria-label="Application stage ${i+1}" onchange="updateJob(${i},'status',this.value)">${['Researching','Applied','Interview','Offer','Closed'].map(v=>`<option ${j.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="small danger" onclick="removeJob(${i})" aria-label="Remove role">×</button></div>`).join(''):'<div class="empty">Your next chapter starts with one well-chosen role.<br>Add a company and your next action.</div>'}</div><div class="card space"><h2>Weekly evidence review</h2><p class="details">Use every seventh day to review: one health win, one independently solved problem, one technical example, one speaking clip and your next career action.</p><div class="grid two"><div>${textField('My latest review: what is working?','review','Specific evidence beats “I should do better.”')}<p class="tiny">Saved to Day ${selected}. Open a different day in Daily studio to keep separate reviews.</p></div><div><h4>Day 91 result card</h4><ul class="details list"><li>Health: ${S.settings.startWeight} → ${latestWeight().toFixed(1)} kg; ${strength} strength sessions.</li><li>Problem solving: ${st.solved} solved; ${st.mastered} mastered.</li><li>Technical growth: ${tech} documented explorations.</li><li>Speaking: ${st.vid} published private clips; compare Day 1 and 91.</li><li>Career: ${S.jobs.filter(j=>j.status==='Offer').length} recorded offers; assess actual compensation and work setup.</li></ul><button class="small" onclick="go('daily',91)">Open the finale →</button></div></div></div>`;}
function addJob(){S.jobs.push({id:Date.now(),company:'',role:'',salary:'',status:'Researching',created:todayISO()});save();render();}
function updateJob(i,k,v){if(k==='salary'&&v!==''&&(!Number.isFinite(+v)||+v<0||+v>500)){toast('Enter a valid salary in LPA.');return;}S.jobs[i][k]=v;save();if(k==='status')render();}

function lettersView(){let e=readEntry(selected),letters=Object.keys(S.entries).map(Number).filter(d=>readEntry(d).letter).sort((a,b)=>b-a);return `<div class="titleline"><div><div class="eyebrow">A softer place to land</div><h1>Dear me, you’re worth the effort.</h1><p class="muted">No score. No perfect words. Just an honest conversation with yourself.</p></div>${dayNav()}</div><div class="grid split"><div class="card"><div class="cardhead"><h2>Day ${selected} · ${pretty(dateFor(selected))}</h2><span class="sticker">this is just for you</span></div><textarea class="letter" aria-label="Letter to myself" placeholder="Dear me, today I’m proud of…" oninput="setText('letter',this.value)">${esc(e.letter||'')}</textarea><div class="grid two space">${textField('One thing I’m grateful for','gratitude','A moment, a person, a small win…')}${textField('Tomorrow I need…','tomorrow','A practical kindness to my future self…')}</div></div><div><div class="card peach"><h2>A letter to Day 91 me</h2><p class="details">Describe how you want your life to feel, not only how you want to look.</p><textarea aria-label="Future self letter" oninput="S.futureLetter=this.value;save()" placeholder="When you read this on Day 91…">${esc(S.futureLetter)}</textarea><p class="tiny">Saved locally; always available to reread.</p></div><div class="card space"><h2>Your pages so far</h2>${letters.length?letters.slice(0,30).map(d=>`<button style="display:block;width:100%;text-align:left;margin:8px 0" onclick="go('letters',${d})"><span class="tiny">DAY ${d} · ${pretty(dateFor(d))}</span><div>${esc(readEntry(d).letter.slice(0,75))}${readEntry(d).letter.length>75?'…':''}</div></button>`).join(''):'<div class="empty">Your first letter can be one sentence.</div>'}</div></div></div>`;}

function setSetting(k,v){const nkeys=['startWeight','targetWeight','steps','gita','rewardThreshold'];if(nkeys.includes(k)){v=Number(v);const ranges={startWeight:[25,350],targetWeight:[25,350],steps:[1000,40000],gita:[1,120],rewardThreshold:[80,100]};if(!Number.isFinite(v)||v<ranges[k][0]||v>ranges[k][1]||['steps','gita'].includes(k)&&!Number.isInteger(v)||k==='rewardThreshold'&&![80,90,100].includes(v)){toast('That value is outside the supported range.');render();return;}}if(k==='start'&&!validDate(v)||k==='wake'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){toast('Please enter a valid date or time.');render();return;}if(k==='name'){v=v.trim().slice(0,60);if(!v)return;}if(k==='gitaUrl'&&v&&!isHttp(v)){toast('Use a full http:// or https:// URL.');render();return;}if(['start','steps','wake','gita','rewardThreshold'].includes(k)&&Object.keys(S.entries).length>0&&!confirm('This changes how existing days are dated or scored. Keep this change?')){render();return;}S.settings[k]=v;save();render();}

function timeMinutes(t){let [h,m]=t.split(':').map(Number);return h*60+m;}
function scheduleWarnings(slots){let sorted=slots.filter(s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s.time)).map(s=>({...s,start:timeMinutes(s.time)})).sort((a,b)=>a.start-b.start),warnings=[];for(let i=0;i<sorted.length;i++){let a=sorted[i];if(a.start+a.minutes>1440)warnings.push(a.title+' continues after midnight.');for(let j=i+1;j<sorted.length;j++){let b=sorted[j];if(b.start<a.start+a.minutes)warnings.push(a.title+' overlaps '+b.title+'.');else break;}}return warnings;}
function scheduleHTML(){let s=getSlots(),warnings=scheduleWarnings(s);return `<div class="schedule">${s.map((a,i)=>`<div class="slot"><input type="time" aria-label="Block ${i+1} start time" value="${a.time}" onchange="editSlot(${i},'time',this.value)"><input aria-label="Block ${i+1} activity" value="${esc(a.title)}" onchange="editSlot(${i},'title',this.value)"><input type="number" min="1" max="720" aria-label="Block ${i+1} minutes" value="${a.minutes}" onchange="editSlot(${i},'minutes',this.value)"><button class="remove ghost" aria-label="Delete block ${i+1}" onclick="removeSlot(${i})">×</button></div>`).join('')}</div><p class="tiny">Time · activity · minutes. ${s.reduce((n,a)=>n+num(a.minutes),0)} scheduled minutes. Office assumption: 10 am–7 pm; lunch and break walks depend on your availability. Aim for bed around 10:30 pm.</p>${warnings.length?`<div class="notice">${warnings.map(esc).join('<br>')}</div>`:''}`;}

async function connectBackup(){if(!window.showSaveFilePicker){toast('Automatic file backup needs desktop Chrome or Edge. Use Download backup in this browser.');return;}try{let h=await window.showSaveFilePicker({suggestedName:'GlowQuest-autosave.json',types:[{description:'GlowQuest JSON backup',accept:{'application/json':['.json']}}]});let existing=await h.getFile();if(existing.size){let candidate;try{candidate=validateState(JSON.parse(await existing.text()));}catch{toast('That file is not a valid GlowQuest backup. Choose a new filename; it was not overwritten.');return;}if(!confirm('This file already contains a GlowQuest backup. Load its progress into this browser and connect it for future saves? This replaces current browser entries. Cancel leaves everything unchanged.'))return;S=candidate;storageOK=true;loadError='';selected=clamp(todayDay(),1,91);}fileHandle=h;save();await writeBackup();if(view==='settings')render();}catch(e){if(e.name!=='AbortError')toast('File connection failed. Download a backup instead.');}}
function writeBackup(){if(!fileHandle)return Promise.resolve();const handle=fileHandle,payload=JSON.stringify(S,null,2);writeChain=writeChain.catch(()=>{}).then(async()=>{try{let writable=await handle.createWritable();await writable.write(payload);await writable.close();status('Saved to browser + file');}catch(e){fileHandle=null;status('File backup paused — browser saved',!storageOK);toast('File backup paused. Reconnect it or download a backup.');}});return writeChain;}
function validateState(x){if(!x||typeof x!=='object'||Array.isArray(x)||x.version!==1)throw Error('Unsupported backup format.');let raw=JSON.stringify(x);if(raw.length>15000000)throw Error('Backup is too large.');const walk=o=>{if(o&&typeof o==='object')for(const k of Object.keys(o)){if(['__proto__','prototype','constructor'].includes(k))throw Error('Invalid backup key.');walk(o[k]);}};walk(x);let st=emptyState();if(!x.settings||!validDate(x.settings.start))throw Error('Invalid start date.');st.settings={...DEFAULTS,...x.settings};for(const [k,min,max] of [['startWeight',25,350],['targetWeight',25,350],['steps',1000,40000],['gita',1,120],['rewardThreshold',80,100]])if(typeof st.settings[k]!=='number'||!Number.isFinite(st.settings[k])||st.settings[k]<min||st.settings[k]>max)throw Error('Invalid setting: '+k);if(![80,90,100].includes(st.settings.rewardThreshold)||typeof st.settings.name!=='string'||st.settings.name.length>60||!/^([01]\d|2[0-3]):[0-5]\d$/.test(st.settings.wake))throw Error('Invalid settings.');if(st.settings.gitaUrl&&!isHttp(st.settings.gitaUrl))throw Error('Invalid Gita link.');for(const key of ['entries','problems','claims'])if(!x[key]||typeof x[key]!=='object'||Array.isArray(x[key]))throw Error('Missing '+key);for(const [k,e]of Object.entries(x.entries)){if(!/^\d+$/.test(k)||+k<1||+k>91||!e||typeof e!=='object'||Array.isArray(e))throw Error('Invalid daily entry.');for(const [f,min,max]of [['steps',0,100000],['weight',25,350],['gita',0,1440],['sleep',0,24],['energy',1,5],['clarity',1,5],['confidence',1,5],['fillers',0,500]])if(e[f]!==undefined&&e[f]!==''&&(typeof e[f]!=='number'||!Number.isFinite(e[f])||e[f]<min||e[f]>max))throw Error('Invalid daily metric.');for(const f of ['meal','food','dsa','tech','video','posted','vocab','strength','career','busy'])if(e[f]!==undefined&&typeof e[f]!=='boolean')throw Error('Invalid completion flag.');if(e.habits&&(typeof e.habits!=='object'||Array.isArray(e.habits)||Object.entries(e.habits).some(([k,v])=>! /^(habit|extra)\d+$/.test(k)||typeof v!=='boolean')))throw Error('Invalid habit checks.');if(e.wake&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.wake))throw Error('Invalid wake time.');if(e.schedule&&(!Array.isArray(e.schedule)||e.schedule.length>100||e.schedule.some(s=>typeof s.title!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(s.time)||!Number.isInteger(s.minutes)||s.minutes<1||s.minutes>720)))throw Error('Invalid schedule.');if(e.extras&&(!Array.isArray(e.extras)||e.extras.some(h=>typeof h.id!=='string'||!/^extra\d+$/.test(h.id)||typeof h.title!=='string')))throw Error('Invalid extras.');for(const f of ['letter','gratitude','tomorrow','techNote','vocabNote','foodNote','dsaNote','careerNote','speechPrompt','videoNote','gitaNote','review'])if(e[f]!==undefined&&typeof e[f]!=='string')throw Error('Invalid journal field.');}
for(const [k,p]of Object.entries(x.problems)){if(!/^\d+$/.test(k)||+k<1||+k>(x.dsaCatalog===DATA.dsaCatalog?DATA.problems.length:180)||!p||typeof p!=='object'||Array.isArray(p)||p.day&&(!Number.isInteger(p.day)||p.day<1||p.day>91)||p.status&&!['Not started','Attempted','Solved','Mastered'].includes(p.status)||p.reviewDue&&!validDate(p.reviewDue)||p.url&&!isHttp(p.url))throw Error('Invalid problem record.');if(p.learning&&(typeof p.learning!=='object'||Array.isArray(p.learning)||Object.entries(p.learning).some(([k,v])=>!['concept','dryrun','explain'].includes(k)||typeof v!=='boolean')))throw Error('Invalid DSA learning checks.');}
for(const [k,c]of Object.entries(x.claims))if(!/^[0-6]$/.test(k)||!c||!validDate(c.date))throw Error('Invalid reward history.');for(const key of ['jobs','habits'])if(!Array.isArray(x[key])||x[key].length>2000)throw Error('Invalid '+key);for(const j of x.jobs)if(typeof j.company!=='string'||typeof j.role!=='string'||!['Researching','Applied','Interview','Offer','Closed'].includes(j.status))throw Error('Invalid job record.');for(const h of x.habits)if(typeof h.title!=='string'||typeof h.id!=='string'||!/^habit\d+$/.test(h.id))throw Error('Invalid habit.');st.entries=x.entries;st.problems=x.problems;st.claims=x.claims;st.jobs=x.jobs;st.habits=x.habits;st.futureLetter=typeof x.futureLetter==='string'?x.futureLetter:'';st.updatedAt=x.updatedAt||null;st.lastExport=typeof x.lastExport==='string'&&validDate(x.lastExport.slice(0,10))?x.lastExport:null;st.dsaCatalog=x.dsaCatalog||null;st.legacyDsa=x.legacyDsa&&typeof x.legacyDsa==='object'&&!Array.isArray(x.legacyDsa)?x.legacyDsa:{};return migrateDsa(nValidateState(st,x));}
async function importBackup(file){try{if(file.size>15000000)throw Error('Backup must be under 15 MB.');let candidate=validateState(JSON.parse(await file.text()));if(!confirm('Restore this backup? It replaces the current local entries. Download your current backup first if you want to keep both.'))return;fileHandle=null;clearTimeout(backupTimer);S=candidate;storageOK=true;loadError='';selected=clamp(todayDay(),1,91);save();render();toast('Your backup is restored. Reconnect file auto-backup if needed.');}catch(e){toast('Could not restore: '+e.message);}}

const GUIDE=`GLOWQUEST — BECOMING RINKAL

1. Extract the ZIP into a permanent folder, such as Documents/GlowQuest.
2. Double-click GlowQuest.html. Use Chrome or Edge for the best experience.
3. No VS Code, installation, account, terminal or server is needed.
4. Use Daily studio to log results, Learning lab for practice and revision,
   Levels & rewards for rewards, and Letters to me for your journal.
5. Every change autosaves in this browser. Keep the same file location and
   browser profile. Private browsing and clearing browser data can remove it.
6. In Make it mine, connect an auto-backup JSON file. Reconnect after each
   reopening. Alternatively click Backup regularly and keep the downloaded JSON.
7. To move computers or browser profiles: download a backup, copy the HTML,
   open it in the new browser, and use Restore backup. Never edit the JSON manually.
8. Video recording, when supported, needs camera/microphone permission. Download
   each take separately before navigating away. If unsupported, use your phone
   or Windows Camera and record completion in the dashboard. Post clips yourself.
9. Plan: 15 Oct 2026 through 13 Jan 2027. Seven levels total 91 days. Day 91 is
   the finale. Change the start date only if you intend to shift all day numbers.
